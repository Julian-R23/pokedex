                { name: "Regalos y Fósiles", encounters: [{ id: 351, rate: "100%", method: "Regalo (Inst. Meteorológico)" }, { id: 360, rate: "100%", method: "Huevo (Pueblo Lavacalda)" }, { id: 374, rate: "100%", method: "Casa de Máximo (Post-Game)" }, { id: 345, rate: "Elegir", method: "Torre Espejismo (Revivir en Devon)" }, { id: 347, rate: "Elegir", method: "Torre Espejismo (Revivir en Devon)" }] }
            ]
        };

        // Estado en memoria y variables de los filtros
        let caughtState = {}; 
        let currentView = 'pokedex';
        let searchQuery = '';
        let filterState = 'all'; // 'all', 'caught', 'missing'
        
        let db, auth, userId;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hoenn-tracker';

        function getPokemonName(id) {
            const p = pokedex.find(p => p.id === id);
            return p ? p.name : `Desconocido (${id})`;
        }

        function getWikidexUrl(name) {
            // Reemplaza espacios por guiones bajos para que la URL de Wikidex funcione (ej. "Mr. Mime" -> "Mr._Mime")
            const safeName = name.replace(/ /g, '_');
            return `https://www.wikidex.net/wiki/${safeName}`;
        }
        
        function isAvailableInGame(pokemonId, gameName) {
            if (!routeData[gameName]) return false;
            for (let route of routeData[gameName]) {
                if (route.encounters.some(e => e.id === pokemonId)) return true;
            }
            return false;
        }

        window.toggleCaught = async function(pokemonId) {
            caughtState[pokemonId] = !caughtState[pokemonId];
            renderCurrentView(); 
            
            // Backup local en caso de que Firebase falle
            localStorage.setItem('hoennTrackerData', JSON.stringify(caughtState));
            
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) {
                    console.error("Error al guardar tu progreso:", error);
                }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-slate-700');
            });
            document.getElementById(`nav-${viewName}`).classList.add('bg-slate-700');
            
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) {
            searchQuery = value.toLowerCase();
            renderCurrentView();
        }

        window.updateFilter = function(value) {
            filterState = value;
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {
                container.innerHTML = generatePokedexHTML();
                document.body.className = "bg-gray-100 text-gray-800 min-h-screen flex flex-col game-bg-pokedex";
            } else {
                container.innerHTML = generateGamePageHTML(currentView);
                const bgColors = {
                    'Rubí': 'game-bg-ruby',
                    'Zafiro': 'game-bg-sapphire',
                    'Esmeralda': 'game-bg-emerald'
                };
                document.body.className = `text-gray-800 min-h-screen flex flex-col ${bgColors[currentView]}`;
            }
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                    <div class="p-6 bg-slate-800 text-white border-b border-gray-700">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3">
                            Pokédex de Hoenn
                            <span class="text-sm font-normal bg-emerald-600 px-3 py-1 rounded-full text-emerald-100">
                                ${totalCaught} / ${pokedex.length} Atrapados
                            </span>
                        </h1>
                        
                        <!-- Barra de Progreso -->
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>

                        <!-- Controles de Búsqueda y Filtro -->
                        <div class="mt-6 flex flex-col sm:flex-row gap-4">
                            <input type="text" 
                                   placeholder="Buscar por nombre o número..." 
                                   class="px-4 py-2 rounded-lg text-gray-800 w-full sm:w-1/2 focus:ring-2 focus:ring-emerald-500 outline-none"
                                   value="${searchQuery}"
                                   onkeyup="updateSearch(this.value)">
                            
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-emerald-500 outline-none cursor-pointer"
                                    onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos los Pokémon</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Solo Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600 font-bold">
                                <tr>
                                    <th class="px-6 py-4 text-center">Atrapado</th>
                                    <th class="px-6 py-4 text-center">Nº</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución</th>
                                    <th class="px-6 py-4">Juegos (Ir a Ruta)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.id] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || 
                                      String(poke.hoenn_id).includes(searchQuery);
                
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;

                return matchesSearch && matchesFilter;
            });

            if (filteredPokedex.length === 0) {
                html += `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">No se encontraron Pokémon con esos criterios.</td></tr>`;
            }

            filteredPokedex.forEach(poke => {
                const isCaught = caughtState[poke.id] || false;
                
                let badges = '';
                const games = [
                    { name: 'Rubí', color: 'bg-red-100 text-red-700 border-red-300 hover:bg-red-200' },
                    { name: 'Zafiro', color: 'bg-blue-100 text-blue-700 border-blue-300 hover:bg-blue-200' },
                    { name: 'Esmeralda', color: 'bg-emerald-100 text-emerald-700 border-emerald-300 hover:bg-emerald-200' }
                ];

                games.forEach(g => {
                    if (isAvailableInGame(poke.id, g.name)) {
                        badges += `<button onclick="navigate('${g.name}')" class="px-2 py-1 text-xs border rounded-md font-semibold mr-2 transition ${g.color}">${g.name}</button>`;
                    }
                });

                if (badges === '') badges = `<span class="text-xs text-gray-400 italic">Otras rutas/Pescando/Surf</span>`;

                html += `
                    <tr class="hover:bg-gray-50 transition duration-150 ${isCaught ? 'bg-emerald-50/50' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" 
                                   class="w-6 h-6 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500 cursor-pointer checkbox-anim" 
                                   ${isCaught ? 'checked' : ''} 
                                   onchange="toggleCaught(${poke.id})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.hoenn_id).padStart(3, '0')}</td>
                        <td class="px-6 py-2">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.id}.png" 
                                 alt="${poke.name}" 
                                 class="w-12 h-12 inline-block object-contain pixelated"
                                 onerror="this.style.display='none'">
                        </td>
                        <td class="px-6 py-4 font-bold text-base">
                            <a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${poke.name}</a>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium text-emerald-700">${poke.evo}</td>
                        <td class="px-6 py-4">${badges}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            
            let headerStyles = '';
            if (gameName === 'Rubí') headerStyles = 'bg-red-600 text-white';
            if (gameName === 'Zafiro') headerStyles = 'bg-blue-600 text-white';
            if (gameName === 'Esmeralda') headerStyles = 'bg-emerald-600 text-white';

            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/20 mb-8">
                        <div class="p-8 ${headerStyles}">
                            <h1 class="text-4xl font-extrabold mb-2">Edición ${gameName}</h1>
                            <p class="text-lg opacity-90">Lista extendida de rutas, intercambios con NPC y encuentros especiales.</p>
                        </div>
                    </div>
                    
                    <div class="space-y-8">
            `;

            if (!routes || routes.length === 0) {
                html += `<p class="text-center text-gray-600 py-10 bg-white/50 rounded-xl">Datos no disponibles.</p>`;
            } else {
                routes.forEach(route => {
                    html += `
                        <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-md overflow-hidden">
                            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                                <h2 class="text-xl font-bold text-gray-800">${route.name}</h2>
                            </div>
                            <div class="p-0 overflow-x-auto">
                                <table class="w-full text-left text-sm whitespace-nowrap">
                                    <thead class="bg-gray-100/50 text-gray-600 text-xs uppercase font-semibold">
                                        <tr>
                                            <th class="px-6 py-3 w-16 text-center">Atrapado</th>
                                            <th class="px-6 py-3">Pokémon</th>
                                            <th class="px-6 py-3">Ratio / Condición</th>
                                            <th class="px-6 py-3">Método / Ubicación exacta</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                    `;

                    route.encounters.forEach(encounter => {
                        const pokeName = getPokemonName(encounter.id);
                        const isCaught = caughtState[encounter.id] || false;
                        
                        html += `
                            <tr class="hover:bg-gray-50/80 transition ${isCaught ? 'bg-emerald-50/40' : ''}">
                                <td class="px-6 py-3 text-center">
                                    <input type="checkbox" 
                                           class="w-5 h-5 text-emerald-600 rounded border-gray-300 cursor-pointer checkbox-anim focus:ring-emerald-500" 
                                           ${isCaught ? 'checked' : ''} 
                                           onchange="toggleCaught(${encounter.id})">
                                </td>
                                <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" 
                                         alt="${pokeName}" 
                                         class="w-10 h-10 object-contain"
                                         onerror="this.style.display='none'">
                                    <span>
                                        <a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${pokeName}</a> 
                                        <span class="text-xs text-gray-400 font-mono ml-1">#${encounter.id}</span>
                                    </span>
                                </td>
                                <td class="px-6 py-3">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">
                                        ${encounter.rate}
                                    </span>
                                </td>
                                <td class="px-6 py-3 text-gray-600">${encounter.method}</td>
                            </tr>
                        `;
                    });

                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;
            
            return html;
        }

        async function setupCloudStorage() {
            try {
                // Intenta recuperar los datos locales primero
                const localData = localStorage.getItem('hoennTrackerData');
                if (localData) {
                    caughtState = JSON.parse(localData);
                    renderCurrentView();
                }

                if (typeof __firebase_config === 'undefined') return;
                
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    // REEMPLÁZALO POR ESTO:
await signInAnonymously(auth);

// Sistema de sincronización por código
let mySyncCode = localStorage.getItem('pokemonSyncCode');
if (!mySyncCode) {
    mySyncCode = prompt("Ingresa una palabra secreta para sincronizar tu progreso entre dispositivos (ej. JulianDex2026):");
    if (mySyncCode) {
        localStorage.setItem('pokemonSyncCode', mySyncCode);
    }
}

// Usamos tu palabra secreta como ID principal, o el anónimo si cancelas
userId = mySyncCode || auth.currentUser?.uid;
if (!userId) return;

                document.getElementById('storage-status').textContent = "Hoenn Tracker - Conectado. Tu progreso se guarda automáticamente en la nube.";

                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        caughtState = { ...caughtState, ...snapshot.data() };
                        renderCurrentView();
                    }
                }, (error) => {
                    console.error("Error al obtener los datos guardados:", error);
                });

            } catch (error) {
                console.error("Error inicializando el almacenamiento:", error);
                document.getElementById('storage-status').textContent = "Hoenn Tracker - Guardado de manera local en el navegador.";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            navigate('pokedex');
            setupCloudStorage();
        });

    </script>
</body>
</html>
