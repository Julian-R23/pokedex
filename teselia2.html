        let caughtState = {}; 
        let currentView = 'pokedex';
        let searchQuery = '';
        let filterState = 'all'; 
        
        let db, auth, userId;
        const appId = 'b2w2-tracker';

        function getWikidexUrl(name) {
            const safeName = name.replace(/ /g, '_');
            return `https://www.wikidex.net/wiki/${safeName}`;
        }

        function getPokemonName(id) {
            const p = pokedex.find(p => p.id === id);
            return p ? p.name : `Desconocido (${id})`;
        }

        function isAvailableInGame(pokemonId, gameName) {
            if (!routeData[gameName]) return false;
            for (let route of routeData[gameName]) {
                if (route.encounters.some(e => e.id === pokemonId)) return true;
            }
            return false;
        }

        window.toggleCaught = async function(pokemonId) {
            caughtState[pokemonId] = !caughtState[pokemonId];
            renderCurrentView(); 
            localStorage.setItem('b2w2TrackerData', JSON.stringify(caughtState));
            
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) { console.error("Error:", error); }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800');
                btn.classList.add('bg-transparent');
            });
            
            const activeBtn = document.getElementById(`nav-${viewName}`);
            activeBtn.classList.remove('bg-transparent');
            activeBtn.classList.add('bg-slate-800');
            
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) {
            searchQuery = value.toLowerCase();
            renderCurrentView();
        }

        window.updateFilter = function(value) {
            filterState = value;
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {
                container.innerHTML = generatePokedexHTML();
                document.body.className = "bg-gray-100 text-gray-800 min-h-screen flex flex-col game-bg-pokedex";
            } else {
                container.innerHTML = generateGamePageHTML(currentView);
                const bgClass = currentView === 'Negro 2' ? 'game-bg-black2' : 'game-bg-white2';
                document.body.className = `min-h-screen flex flex-col ${bgClass}`;
            }
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                    <div class="p-6 bg-slate-800 text-white border-b border-cyan-900">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3 text-cyan-400">

                                ${totalCaught} / ${pokedex.length} Atrapados
                            </span>
                        </h1>
                        <p class="text-slate-400 mt-2 text-sm">Lista representativa de la Pokédex Expandida de 300 Pokémon y Legendarios Post-Game.</p>
                        <div class="w-full bg-slate-900 rounded-full h-2.5 mt-4 border border-slate-700">
                            <div class="bg-cyan-500 h-2.5 rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(6,182,212,0.6)]" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="mt-6 flex flex-col sm:flex-row gap-4">

                            <select class="px-4 py-2 rounded-lg bg-slate-700 text-white focus:ring-2 focus:ring-cyan-500 outline-none cursor-pointer border border-slate-600" onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos los Pokémon</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Solo Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600 font-bold">

                                    <th class="px-6 py-4 text-center">Nº Nac.</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución</th>
                                    <th class="px-6 py-4">Versión Destacada</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.id] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.id).includes(searchQuery);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesFilter;
            });

                html += `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">No se encontraron Pokémon.</td></tr>`;
            }

            let regionalPrinted = false;
            let nationalPrinted = false;

            filteredPokedex.forEach((poke, index) => {
                const isCaught = caughtState[poke.id] || false;
                
                // Divisores de categoría
                if (index === 0 && !regionalPrinted) {
                    html += `<tr><td colspan="6" class="px-6 py-3 bg-cyan-50 text-cyan-800 font-bold text-center uppercase tracking-widest text-xs border-y border-cyan-200">⬇ Pokédex Regional Teselia (B2/W2) ⬇</td></tr>`;
                    regionalPrinted = true;
                } else if (poke.id === 144 && !nationalPrinted) {
                    html += `<tr><td colspan="6" class="px-6 py-3 bg-slate-800 text-white font-bold text-center uppercase tracking-widest text-xs border-y border-slate-900 mt-4">⬇ Pokédex Nacional (Post-Game) ⬇</td></tr>`;
                    nationalPrinted = true;
                }

                let badges = '';
                const games = [
                    { name: 'Negro 2', color: 'bg-slate-800 text-cyan-300 border-cyan-800' },
                    { name: 'Blanco 2', color: 'bg-red-50 text-red-600 border-red-300' }
                ];

                games.forEach(g => {
                    if (isAvailableInGame(poke.id, g.name)) {
                        badges += `<button onclick="navigate('${g.name}')" class="px-2 py-1 text-xs border rounded-md font-semibold mr-2 transition hover:opacity-70 ${g.color}">${g.name}</button>`;
                    }
                });

                if (badges === '') badges = `<span class="text-xs text-gray-400 italic">Otras rutas/Evolución</span>`;

                html += `
                    <tr class="hover:bg-cyan-50/50 transition duration-150 ${isCaught ? 'bg-cyan-100/40' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-cyan-600 rounded border-gray-300 focus:ring-cyan-500 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.id})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.id).padStart(3, '0')}</td>
                        <td class="px-6 py-2">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.id}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain pixelated" onerror="this.style.display='none'">
                        </td>
                        <td class="px-6 py-4 font-bold text-base">
                            <a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${poke.name}</a>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium text-cyan-700">${poke.evo}</td>
                        <td class="px-6 py-4">${badges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            
            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/10 mb-8 p-8 ${gameName === 'Negro 2' ? 'bg-slate-900 border-cyan-800 text-cyan-50' : 'bg-white border-red-200 text-slate-800'}">
                        <h1 class="text-4xl font-extrabold mb-2 ${gameName === 'Negro 2' ? 'text-cyan-400' : 'text-red-500'}">Edición ${gameName}</h1>
                        <p class="text-lg opacity-90">Lugares clave, Pokémon exclusivos y legendarios del Post-Game.</p>
                    </div>
                    <div class="space-y-8">
            `;

            if (!routes || routes.length === 0) {
                html += `<p class="text-center text-gray-600 py-10 bg-white/50 rounded-xl">Datos no disponibles.</p>`;
            } else {
                routes.forEach(route => {
                    html += `
                        <div class="route-card rounded-xl overflow-hidden transition-colors duration-200">
                            <div class="px-6 py-4 border-b border-opacity-30">
                                <h2 class="text-xl font-bold">${route.name}</h2>
                            </div>
                            <div class="p-0 overflow-x-auto">
                                <table class="w-full text-left text-sm whitespace-nowrap">
                                    <thead class="text-xs uppercase font-semibold">
                                        <tr>
                                            <th class="px-6 py-3 w-16 text-center">Atrapado</th>
                                            <th class="px-6 py-3">Pokémon</th>
                                            <th class="px-6 py-3">Ratio</th>
                                            <th class="px-6 py-3">Método / Ubicación</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-opacity-20">
                    `;

                    route.encounters.forEach(encounter => {
                        const pokeName = getPokemonName(encounter.id);
                        const isCaught = caughtState[encounter.id] || false;
                        const caughtBgClass = isCaught ? (gameName === 'Negro 2' ? 'bg-cyan-900/40' : 'bg-red-50/80') : '';
                        const checkColor = gameName === 'Negro 2' ? 'text-cyan-500 focus:ring-cyan-500' : 'text-red-500 focus:ring-red-500';
                        
                        html += `
                            <tr class="transition ${caughtBgClass}">
                                <td class="px-6 py-3 text-center">
                                    <input type="checkbox" class="w-5 h-5 rounded border-gray-400 cursor-pointer checkbox-anim bg-transparent ${checkColor}" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                                </td>
                                <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                    <span>
                                        <a href="${getWikidexUrl(pokeName)}" target="_blank" class="hover:underline transition font-bold" title="Ver en Wikidex">${pokeName}</a> 
                                        <span class="text-xs font-mono ml-1 opacity-50">#${encounter.id}</span>
                                    </span>
                                </td>
                                <td class="px-6 py-3"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 ${gameName === 'Negro 2' ? 'text-slate-800' : ''}">${encounter.rate}</span></td>
                                <td class="px-6 py-3 opacity-80">${encounter.method}</td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table></div></div>`;
                });
            }
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const localData = localStorage.getItem('b2w2TrackerData');
                if (localData) {
                    caughtState = JSON.parse(localData);
                    renderCurrentView();
                }

                if (typeof __firebase_config === 'undefined') return;
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser?.uid;
                if (!userId) return;

                document.getElementById('storage-status').textContent = "B2W2 Tracker - Conectado al PC de Trufa (Nube activa).";
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        caughtState = { ...caughtState, ...snapshot.data() };
                        renderCurrentView();
                    }
                });
            } catch (error) {
                document.getElementById('storage-status').textContent = "B2W2 Tracker - Guardado de manera local en tu Pokédex.";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            navigate('pokedex');
            setupCloudStorage();
        });
    </script>
</body>
</html>
