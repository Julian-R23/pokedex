            { regionalId: 9, natId: 779, name: "Bruxish", evo: "Final", zone: "Ula-ula" },
            { regionalId: 10, natId: 780, name: "Drampa", evo: "Final (Exclusivo Luna)", zone: "Ula-ula" },
            { regionalId: 11, natId: 781, name: "Dhelmise", evo: "Final", zone: "Ula-ula" },
            { regionalId: 12, natId: 304, name: "Aron", evo: "Nv. 32", zone: "Ula-ula" },
            { regionalId: 13, natId: 305, name: "Lairon", evo: "Nv. 42", zone: "Ula-ula" },
            { regionalId: 14, natId: 306, name: "Aggron", evo: "Final", zone: "Ula-ula" },
            { regionalId: 15, natId: 787, name: "Tapu Bulu", evo: "Guardian Legendario", zone: "Ula-ula" },

            // --- ISLA PONI (#001 - #100) ---
            { regionalId: 1, natId: 782, name: "Jangmo-o", evo: "Nv. 35", zone: "Poni" },
            { regionalId: 2, natId: 783, name: "Hakamo-o", evo: "Nv. 45", zone: "Poni" },
            { regionalId: 3, natId: 784, name: "Kommo-o", evo: "Final", zone: "Poni" },
            { regionalId: 4, natId: 788, name: "Tapu Fini", evo: "Guardian Legendario", zone: "Poni" },
            { regionalId: 5, natId: 789, name: "Cosmog", evo: "Nv. 43", zone: "Poni" },
            { regionalId: 6, natId: 790, name: "Cosmoem", evo: "Nv. 53 (Según versión)", zone: "Poni" },
            { regionalId: 7, natId: 791, name: "Solgaleo", evo: "Legendario (Sol)", zone: "Poni" },
            { regionalId: 8, natId: 792, name: "Lunala", evo: "Legendario (Luna)", zone: "Poni" },
            { regionalId: 9, natId: 793, name: "Nihilego", evo: "Ultraente", zone: "Poni" },
            { regionalId: 10, natId: 794, name: "Buzzwole", evo: "Ultraente (Sol)", zone: "Poni" },
            { regionalId: 11, natId: 795, name: "Pheromosa", evo: "Ultraente (Luna)", zone: "Poni" },
            { regionalId: 12, natId: 796, name: "Xurkitree", evo: "Ultraente", zone: "Poni" },
            { regionalId: 13, natId: 797, name: "Celesteela", evo: "Ultraente (Luna)", zone: "Poni" },
            { regionalId: 14, natId: 798, name: "Kartana", evo: "Ultraente (Sol)", zone: "Poni" },
            { regionalId: 15, natId: 799, name: "Guzzlord", evo: "Ultraente", zone: "Poni" },
            { regionalId: 16, natId: 800, name: "Necrozma", evo: "Legendario", zone: "Poni" },
            { regionalId: 17, natId: 801, name: "Magearna", evo: "Mítico (Código QR)", zone: "Poni" },
            { regionalId: 18, natId: 802, name: "Marshadow", evo: "Mítico (Evento)", zone: "Poni" }
        ];

        const routeData = {
            "Pokémon Sol": [
                { name: "Isla Melemele - Inicio y Rutas 1-3", encounters: [{ id: 722, rate: "Elegir", method: "Inicial" }, { id: 725, rate: "Elegir", method: "Inicial" }, { id: 728, rate: "Elegir", method: "Inicial" }, { id: 731, rate: "Común", method: "Ruta 1" }, { id: 734, rate: "Común (Día)", method: "Ruta 1" }, { id: 742, rate: "Común (Día)", method: "Ruta 2 / Cima Ten Carat" }] },
                { name: "Exclusivos de Sol en Alola", encounters: [{ id: 766, rate: "Exclusivo Sol", method: "Isla Akala - Jungla Sombra" }, { id: 776, rate: "Exclusivo Sol", method: "Isla Ula-Ula - Monte Hokulani" }, { id: 794, rate: "Ultraente (Sol)", method: "Bosque Melemele" }, { id: 798, rate: "Ultraente (Sol)", method: "Isla Ula-Ula" }, { id: 791, rate: "Legendario", method: "Altar del Sol" }] }
            ],
            "Pokémon Luna": [
                { name: "Isla Melemele - Inicio y Rutas 1-3", encounters: [{ id: 722, rate: "Elegir", method: "Inicial" }, { id: 725, rate: "Elegir", method: "Inicial" }, { id: 728, rate: "Elegir", method: "Inicial" }, { id: 731, rate: "Común", method: "Ruta 1" }, { id: 19, rate: "Común (Noche)", method: "Ruta 1" }, { id: 742, rate: "Común (Noche)", method: "Ruta 2 / Cima Ten Carat" }] },
                { name: "Exclusivos de Luna en Alola", encounters: [{ id: 765, rate: "Exclusivo Luna", method: "Isla Akala - Jungla Sombra" }, { id: 780, rate: "Exclusivo Luna", method: "Isla Ula-Ula - Monte Lanakila" }, { id: 795, rate: "Ultraente (Luna)", method: "Cueva Verdant" }, { id: 797, rate: "Ultraente (Luna)", method: "Isla Ula-Ula" }, { id: 792, rate: "Legendario", method: "Altar de la Luna" }] }
            ]
        };

        let caughtState = {}; 
        let currentView = 'pokedex';
        let searchQuery = '';
        let filterState = 'all';
        let zoneFilter = 'all';
        
        let db, auth, userId;
        const appId = 'alola-tracker'; 

        function getWikidexUrl(name) {
            const safeName = name.replace(/ /g, '_');
            return `https://www.wikidex.net/wiki/${safeName}`;
        }

        function getPokemonName(id) {
            const p = pokedex.find(p => p.natId === id);
            return p ? p.name : `Desconocido (${id})`;
        }

        function isAvailableInGame(pokemonId, gameName) {
            if (!routeData[gameName]) return false;
            for (let route of routeData[gameName]) {
                if (route.encounters.some(e => e.id === pokemonId)) return true;
            }
            return false;
        }

        window.toggleCaught = async function(natId) {
            caughtState[natId] = !caughtState[natId];
            renderCurrentView(); 
            localStorage.setItem('alolaTrackerData', JSON.stringify(caughtState));
            
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) { console.error("Error:", error); }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-slate-700'));
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) activeBtn.classList.add('bg-slate-700');
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) {
            searchQuery = value.toLowerCase();
            renderCurrentView();
        }

        window.updateFilter = function(value) {
            filterState = value;
            renderCurrentView();
        }

        window.updateZoneFilter = function(value) {
            zoneFilter = value;
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {
                container.innerHTML = generatePokedexHTML();
                document.body.className = "bg-gray-100 text-gray-800 min-h-screen flex flex-col game-bg-pokedex";
            } else {
                container.innerHTML = generateGamePageHTML(currentView);
                const bgColors = { 'Pokémon Sol': 'game-bg-sun', 'Pokémon Luna': 'game-bg-moon' };
                document.body.className = `text-gray-800 min-h-screen flex flex-col ${bgColors[currentView]}`;
            }
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                    <div class="p-6 bg-slate-800 text-white border-b border-gray-700">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3">
                            Pokédex Regional Alola (Sol / Luna)
                            <span class="text-sm font-normal bg-amber-600 px-3 py-1 rounded-full text-amber-100">
                                ${totalCaught} / ${pokedex.length} Atrapados
                            </span>
                        </h1>
                        <p class="text-slate-400 mt-2 text-sm">Registro Regional ordenado por las 4 Islas oficiales de Alola (Melemele, Akala, Ula-ula y Poni).</p>
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-amber-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <input type="text" placeholder="Buscar por nombre o número..." class="px-4 py-2 rounded-lg text-gray-800 w-full focus:ring-2 focus:ring-amber-500 outline-none" value="${searchQuery}" onkeyup="updateSearch(this.value)">
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none cursor-pointer" onchange="updateZoneFilter(this.value)">
                                <option value="all" ${zoneFilter === 'all' ? 'selected' : ''}>Todas las Islas</option>
                                <option value="Melemele" ${zoneFilter === 'Melemele' ? 'selected' : ''}>Isla Melemele</option>
                                <option value="Akala" ${zoneFilter === 'Akala' ? 'selected' : ''}>Isla Akala</option>
                                <option value="Ula-ula" ${zoneFilter === 'Ula-ula' ? 'selected' : ''}>Isla Ula-ula</option>
                                <option value="Poni" ${zoneFilter === 'Poni' ? 'selected' : ''}>Isla Poni</option>
                            </select>
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none cursor-pointer" onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos los Pokémon</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Solo Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600 font-bold">
                                <tr>
                                    <th class="px-6 py-4 text-center">Atrapado</th>
                                    <th class="px-6 py-4 text-center">Nº Reg.</th>
                                    <th class="px-6 py-4 text-center">Nº Nac.</th>
                                    <th class="px-6 py-4">Isla</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución / Notas</th>
                                    <th class="px-6 py-4">Versión Destacada</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.natId] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.natId).includes(searchQuery) || String(poke.regionalId).includes(searchQuery);
                const matchesZone = (zoneFilter === 'all' || poke.zone === zoneFilter);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesZone && matchesFilter;
            });

            if (filteredPokedex.length === 0) {
                html += `<tr><td colspan="8" class="px-6 py-8 text-center text-gray-500">No se encontraron Pokémon.</td></tr>`;
            }

            filteredPokedex.forEach((poke) => {
                const isCaught = caughtState[poke.natId] || false;
                let badges = '';
                const games = [
                    { name: 'Pokémon Sol', color: 'bg-amber-100 text-amber-800 border-amber-300' },
                    { name: 'Pokémon Luna', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' }
                ];

                games.forEach(g => {
                    if (isAvailableInGame(poke.natId, g.name)) {
                        badges += `<button onclick="navigate('${g.name}')" class="px-2 py-1 text-xs border rounded-md font-semibold mr-2 transition hover:opacity-70 ${g.color}">${g.name}</button>`;
                    }
                });

                if (badges === '') badges = `<span class="text-xs text-gray-400 italic">Ambas/Otra Ruta</span>`;

                let zoneBadgeColor = 'bg-slate-100 text-slate-800';
                if (poke.zone === 'Melemele') zoneBadgeColor = 'bg-yellow-100 text-yellow-800';
                if (poke.zone === 'Akala') zoneBadgeColor = 'bg-pink-100 text-pink-800';
                if (poke.zone === 'Ula-ula') zoneBadgeColor = 'bg-red-100 text-red-800';
                if (poke.zone === 'Poni') zoneBadgeColor = 'bg-purple-100 text-purple-800';

                html += `
                    <tr class="hover:bg-gray-50 transition duration-150 ${isCaught ? 'bg-amber-50/50' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-amber-600 rounded border-gray-300 focus:ring-amber-500 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.natId})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono font-bold text-amber-900">#${String(poke.regionalId).padStart(3, '0')}</td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.natId).padStart(3, '0')}</td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${zoneBadgeColor}">${poke.zone}</span>
                        </td>
                        <td class="px-6 py-2">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.natId}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain pixelated" onerror="this.style.display='none'">
                        </td>
                        <td class="px-6 py-4 font-bold text-base">
                            <a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${poke.name}</a>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium text-amber-700">${poke.evo}</td>
                        <td class="px-6 py-4">${badges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            let headerStyles = '';
            if (gameName === 'Pokémon Sol') headerStyles = 'bg-amber-600 text-white';
            if (gameName === 'Pokémon Luna') headerStyles = 'bg-indigo-600 text-white';

            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/20 mb-8">
                        <div class="p-8 ${headerStyles}">
                            <h1 class="text-4xl font-extrabold mb-2">Edición ${gameName}</h1>
                            <p class="text-lg opacity-90">Exclusivos y encuentros destacados en Alola.</p>
                        </div>
                    </div>
                    <div class="space-y-8">
            `;

            if (!routes || routes.length === 0) {
                html += `<p class="text-center text-gray-600 py-10 bg-white/50 rounded-xl">Datos no disponibles.</p>`;
            } else {
                routes.forEach(route => {
                    html += `
                        <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-md overflow-hidden">
                            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                                <h2 class="text-xl font-bold text-gray-800">${route.name}</h2>
                            </div>
                            <div class="p-0 overflow-x-auto">
                                <table class="w-full text-left text-sm whitespace-nowrap">
                                    <thead class="bg-gray-100/50 text-gray-600 text-xs uppercase font-semibold">
                                        <tr>
                                            <th class="px-6 py-3 w-16 text-center">Atrapado</th>
                                            <th class="px-6 py-3">Pokémon</th>
                                            <th class="px-6 py-3">Ratio</th>
                                            <th class="px-6 py-3">Método / Ubicación</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                    `;

                    route.encounters.forEach(encounter => {
                        const pokeName = getPokemonName(encounter.id);
                        const isCaught = caughtState[encounter.id] || false;
                        
                        html += `
                            <tr class="hover:bg-gray-50/80 transition ${isCaught ? 'bg-amber-50/20' : ''}">
                                <td class="px-6 py-3 text-center">
                                    <input type="checkbox" class="w-5 h-5 text-amber-600 rounded border-gray-300 cursor-pointer checkbox-anim focus:ring-amber-500" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                                </td>
                                <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                    <span>
                                        <a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${pokeName}</a> 
                                        <span class="text-xs text-gray-400 font-mono ml-1">#${encounter.id}</span>
                                    </span>
                                </td>
                                <td class="px-6 py-3"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">${encounter.rate}</span></td>
                                <td class="px-6 py-3 text-gray-600">${encounter.method}</td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table></div></div>`;
                });
            }
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const firebaseConfig = JSON.parse(window.__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const userCred = await signInAnonymously(auth);
                userId = userCred.user.uid;

                document.getElementById('storage-status').innerText = "Rotom-Dex sincronizada con la Nube (Firebase Activo).";

                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const cloudData = docSnap.data();
                        const localData = JSON.parse(localStorage.getItem('alolaTrackerData') || '{}');
                        caughtState = { ...localData, ...cloudData };
                        renderCurrentView();
                    } else {
                        const localData = JSON.parse(localStorage.getItem('alolaTrackerData') || '{}');
                        caughtState = localData;
                        setDoc(docRef, caughtState);
                        renderCurrentView();
                    }
                });
            } catch (error) {
                console.error("Error conectando a la nube:", error);
                const localData = JSON.parse(localStorage.getItem('alolaTrackerData') || '{}');
                caughtState = localData;
                document.getElementById('storage-status').innerText = "Modo Local activado (Sin conexión a la Nube).";
                renderCurrentView();
            }
        }

        setupCloudStorage();
    </script>
</body>
</html>
