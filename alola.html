<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        window.__firebase_config = JSON.stringify({
            apiKey: "AIzaSyBnM2viNQwdBMwn-esGR0XYmFfw0X7pi2Y",
            authDomain: "pokedex-1-4.firebaseapp.com",
            projectId: "pokedex-1-4",
            storageBucket: "pokedex-1-4.firebasestorage.app",
            messagingSenderId: "264689854822",
            appId: "1:264689854822:web:98081e14809e368668c0a7"
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alola Tracker (Sol / Luna) - Rutas y Exclusivos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .game-bg-sun { background: linear-gradient(135deg, #ea580c 0%, #f59e0b 50%, #0f172a 100%); }
        .game-bg-moon { background: linear-gradient(135deg, #4338ca 0%, #3b82f6 50%, #0f172a 100%); }
        .game-bg-pokedex { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
        .checkbox-anim { transition: all 0.2s ease-in-out; }
        .checkbox-anim:checked { transform: scale(1.1); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-xl font-bold tracking-wider cursor-pointer text-amber-400" onclick="navigate('pokedex')">Alola Tracker (Sol/Luna)</span>
                </div>
                <div class="flex items-center space-x-1 md:space-x-4 overflow-x-auto">
                    <button onclick="navigate('pokedex')" id="nav-pokedex" class="nav-btn px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 transition whitespace-nowrap">Pokédex Regional</button>
                    <button onclick="navigate('Pokémon Sol')" id="nav-Pokémon Sol" class="nav-btn px-3 py-2 rounded-md text-sm font-medium text-amber-400 hover:bg-amber-900 hover:text-white transition whitespace-nowrap">Pokémon Sol</button>
                    <button onclick="navigate('Pokémon Luna')" id="nav-Pokémon Luna" class="nav-btn px-3 py-2 rounded-md text-sm font-medium text-indigo-400 hover:bg-indigo-900 hover:text-white transition whitespace-nowrap">Pokémon Luna</button>
                    <button onclick="navigate('Exclusivos')" id="nav-Exclusivos" class="nav-btn px-3 py-2 rounded-md text-sm font-medium text-pink-400 hover:bg-pink-900 hover:text-white transition whitespace-nowrap">Exclusivos de Versión</button>
                </div>
            </div>
        </div>
    </nav>

    <main id="app-content" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full"></main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm mt-auto">
        <p id="storage-status">Alola Tracker - Sincronizado con Rotom-Dex en la Nube...</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const pokedex = [
            { regionalId: 1, natId: 722, name: "Rowlet", evo: "Nv. 17", zone: "Melemele" },
            { regionalId: 2, natId: 723, name: "Dartrix", evo: "Nv. 34", zone: "Melemele" },
            { regionalId: 3, natId: 724, name: "Decidueye", evo: "Final", zone: "Melemele" },
            { regionalId: 4, natId: 725, name: "Litten", evo: "Nv. 17", zone: "Melemele" },
            { regionalId: 5, natId: 726, name: "Torracat", evo: "Nv. 34", zone: "Melemele" },
            { regionalId: 6, natId: 727, name: "Incineroar", evo: "Final", zone: "Melemele" },
            { regionalId: 7, natId: 728, name: "Popplio", evo: "Nv. 17", zone: "Melemele" },
            { regionalId: 8, natId: 729, name: "Brionne", evo: "Nv. 34", zone: "Melemele" },
            { regionalId: 9, natId: 730, name: "Primarina", evo: "Final", zone: "Melemele" },
            { regionalId: 10, natId: 731, name: "Pikipek", evo: "Nv. 14", zone: "Melemele" },
            { regionalId: 11, natId: 732, name: "Trumbeak", evo: "Nv. 28", zone: "Melemele" },
            { regionalId: 12, natId: 733, name: "Toucannon", evo: "Final", zone: "Melemele" },
            { regionalId: 13, natId: 734, name: "Yungoos", evo: "Nv. 20 (Día)", zone: "Melemele" },
            { regionalId: 14, natId: 735, name: "Gumshoos", evo: "Final", zone: "Melemele" },
            { regionalId: 15, natId: 19, name: "Rattata de Alola", evo: "Nv. 20 (Noche)", zone: "Melemele" },
            { regionalId: 16, natId: 20, name: "Raticate de Alola", evo: "Final", zone: "Melemele" },
            { regionalId: 17, natId: 742, name: "Rockruff", evo: "Nv. 25 (Día en Sol / Noche en Luna)", zone: "Melemele" },
            { regionalId: 18, natId: 745, name: "Lycanroc", evo: "Final", zone: "Melemele" },
            { regionalId: 19, natId: 765, name: "Oranguru", evo: "Final (Exclusivo Luna)", zone: "Akala" },
            { regionalId: 20, natId: 766, name: "Passimian", evo: "Final (Exclusivo Sol)", zone: "Akala" },
            { regionalId: 21, natId: 776, name: "Turtonator", evo: "Final (Exclusivo Sol)", zone: "Ula-ula" },
            { regionalId: 22, natId: 780, name: "Drampa", evo: "Final (Exclusivo Luna)", zone: "Ula-ula" },
            { regionalId: 23, natId: 791, name: "Solgaleo", evo: "Legendario (Exclusivo Sol)", zone: "Poni" },
            { regionalId: 24, natId: 792, name: "Lunala", evo: "Legendario (Exclusivo Luna)", zone: "Poni" },
            { regionalId: 25, natId: 794, name: "Buzzwole", evo: "Ultraente (Exclusivo Sol)", zone: "Poni" },
            { regionalId: 26, natId: 795, name: "Pheromosa", evo: "Ultraente (Exclusivo Luna)", zone: "Poni" },
            { regionalId: 27, natId: 797, name: "Celesteela", evo: "Ultraente (Exclusivo Luna)", zone: "Poni" },
            { regionalId: 28, natId: 798, name: "Kartana", evo: "Ultraente (Exclusivo Sol)", zone: "Poni" }
        ];

        const routeData = {
            "Pokémon Sol": [
                { name: "Isla Melemele (Rutas 1 a 3 y Cima Ten Carat)", encounters: [{ id: 722, rate: "Inicial", method: "Elección con Kukui" }, { id: 725, rate: "Inicial", method: "Elección con Kukui" }, { id: 728, rate: "Inicial", method: "Elección con Kukui" }, { id: 731, rate: "Común", method: "Ruta 1 (Hierba)" }, { id: 734, rate: "Común (Día)", method: "Ruta 1 y 2" }, { id: 742, rate: "Común (Día)", method: "Cima Ten Carat" }] },
                { name: "Isla Akala y Ula-ula (Exclusivos de Sol)", encounters: [{ id: 766, rate: "Exclusivo Sol", method: "Jungla Sombra (Confrontación de hierba alta)" }, { id: 776, rate: "Exclusivo Sol", method: "Monte Hokulani" }, { id: 794, rate: "Ultraente", method: "Bosque Melemele (Post-game)" }, { id: 798, rate: "Ultraente", method: "Ruta 17 / Malvalora (Post-game)" }, { id: 791, rate: "Legendario", method: "Altar del Sol (Nivel 55)" }] }
            ],
            "Pokémon Luna": [
                { name: "Isla Melemele (Rutas 1 a 3 y Cima Ten Carat)", encounters: [{ id: 722, rate: "Inicial", method: "Elección con Kukui" }, { id: 725, rate: "Inicial", method: "Elección con Kukui" }, { id: 728, rate: "Inicial", method: "Elección con Kukui" }, { id: 731, rate: "Común", method: "Ruta 1 (Hierba)" }, { id: 19, rate: "Común (Noche)", method: "Ruta 1 (Rattata de Alola)" }, { id: 742, rate: "Común (Noche)", method: "Cima Ten Carat" }] },
                { name: "Isla Akala y Ula-ula (Exclusivos de Luna)", encounters: [{ id: 765, rate: "Exclusivo Luna", method: "Jungla Sombra (Confrontación de hierba alta)" }, { id: 780, rate: "Exclusivo Luna", method: "Monte Lanakila" }, { id: 795, rate: "Ultraente", method: "Cueva Verde / Gruta Unemar (Post-game)" }, { id: 797, rate: "Ultraente", method: "Ruta 17 / Malvalora (Post-game)" }, { id: 792, rate: "Legendario", method: "Altar de la Luna (Nivel 55)" }] }
            ]
        };

        const versionExclusives = {
            "Pokémon Sol": [
                { name: "Passimian", note: "Jungla Sombra (Isla Akala)" },
                { name: "Turtonator", note: "Monte Hokulani (Isla Ula-ula)" },
                { name: "Solgaleo", note: "Altar del Sol (Isla Poni)" },
                { name: "Buzzwole", note: "Bosque Melemele (Ultraente)" },
                { name: "Kartana", note: "Ruta 17 / Malvalora (Ultraente)" }
            ],
            "Pokémon Luna": [
                { name: "Oranguru", note: "Jungla Sombra (Isla Akala)" },
                { name: "Drampa", note: "Monte Lanakila (Isla Ula-ula)" },
                { name: "Lunala", note: "Altar de la Luna (Isla Poni)" },
                { name: "Pheromosa", note: "Cueva Sotobosque (Ultraente)" },
                { name: "Celesteela", note: "Malvalora (Ultraente)" }
            ]
        };

        let caughtState = {}; 
        let currentView = 'pokedex';
        let searchQuery = '';
        let filterState = 'all';
        let zoneFilter = 'all';
        
        let db, auth, userId;
        const appId = 'alola-tracker'; 

        function getWikidexUrl(name) {
            const cleanName = name.split('/')[0].trim();
            return `https://www.wikidex.net/wiki/${cleanName.replace(/ /g, '_')}`;
        }

        function getPokemonName(id) {
            const p = pokedex.find(p => p.natId === id);
            return p ? p.name : `Desconocido (${id})`;
        }

        function isAvailableInGame(pokemonId, gameName) {
            if (!routeData[gameName]) return false;
            for (let route of routeData[gameName]) {
                if (route.encounters.some(e => e.id === pokemonId)) return true;
            }
            return false;
        }

        window.toggleCaught = async function(natId) {
            caughtState[natId] = !caughtState[natId];
            renderCurrentView(); 
            localStorage.setItem('alolaTrackerData', JSON.stringify(caughtState));
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) { console.error("Error:", error); }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-slate-700'));
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) activeBtn.classList.add('bg-slate-700');
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) { searchQuery = value.toLowerCase(); renderCurrentView(); }
        window.updateFilter = function(value) { filterState = value; renderCurrentView(); }
        window.updateZoneFilter = function(value) { zoneFilter = value; renderCurrentView(); }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {
                container.innerHTML = generatePokedexHTML();
                document.body.className = "bg-gray-100 text-gray-800 min-h-screen flex flex-col game-bg-pokedex";
            } else if (currentView === 'Exclusivos') {
                container.innerHTML = generateExclusivesHTML();
                document.body.className = "bg-gray-100 text-gray-800 min-h-screen flex flex-col game-bg-pokedex";
            } else {
                container.innerHTML = generateGamePageHTML(currentView);
                const bgColors = { 'Pokémon Sol': 'game-bg-sun', 'Pokémon Luna': 'game-bg-moon' };
                document.body.className = `text-gray-800 min-h-screen flex flex-col ${bgColors[currentView]}`;
            }
        }

        function generateExclusivesHTML() {
            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200 p-8">
                    <h1 class="text-3xl font-extrabold mb-6 text-slate-900">Pokémon Exclusivos por Versión (Alola)</h1>
                    <p class="text-slate-600 mb-8">Descubre qué criaturas solo se pueden encontrar de forma nativa en Pokémon Sol o Pokémon Luna.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            `;
            for (const [version, list] of Object.entries(versionExclusives)) {
                let badgeColor = version === 'Pokémon Sol' ? 'bg-amber-600' : 'bg-indigo-600';
                html += `
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 shadow-sm">
                        <h2 class="text-2xl font-bold mb-4 text-white p-3 rounded-lg ${badgeColor}">${version}</h2>
                        <ul class="space-y-3">
                `;
                list.forEach(item => {
                    html += `
                        <li class="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-100 shadow-xs">
                            <span class="font-bold text-slate-800"><a href="${getWikidexUrl(item.name)}" target="_blank" class="text-blue-600 hover:underline">${item.name}</a></span>
                            <span class="text-xs text-slate-500 bg-gray-100 px-2 py-1 rounded">${item.note}</span>
                        </li>
                    `;
                });
                html += `</ul></div>`;
            }
            html += `</div></div>`;
            return html;
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                    <div class="p-6 bg-slate-800 text-white border-b border-gray-700">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3">
                            Pokédex Regional Alola (Sol / Luna)
                            <span class="text-sm font-normal bg-amber-600 px-3 py-1 rounded-full text-amber-100">
                                ${totalCaught} / ${pokedex.length} Registrados
                            </span>
                        </h1>
                        <p class="text-slate-400 mt-2 text-sm">Registro oficial dividido por las 4 Islas de Alola.</p>
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-amber-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <input type="text" placeholder="Buscar por nombre o número..." class="px-4 py-2 rounded-lg text-gray-800 w-full focus:ring-2 focus:ring-amber-500 outline-none" value="${searchQuery}" onkeyup="updateSearch(this.value)">
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none cursor-pointer" onchange="updateZoneFilter(this.value)">
                                <option value="all" ${zoneFilter === 'all' ? 'selected' : ''}>Todas las Islas</option>
                                <option value="Melemele" ${zoneFilter === 'Melemele' ? 'selected' : ''}>Isla Melemele</option>
                                <option value="Akala" ${zoneFilter === 'Akala' ? 'selected' : ''}>Isla Akala</option>
                                <option value="Ula-ula" ${zoneFilter === 'Ula-ula' ? 'selected' : ''}>Isla Ula-ula</option>
                                <option value="Poni" ${zoneFilter === 'Poni' ? 'selected' : ''}>Isla Poni</option>
                            </select>
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none cursor-pointer" onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos los Pokémon</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Solo Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600 font-bold">
                                <tr>
                                    <th class="px-6 py-4 text-center">Atrapado</th>
                                    <th class="px-6 py-4 text-center">Nº Reg.</th>
                                    <th class="px-6 py-4 text-center">Nº Nac.</th>
                                    <th class="px-6 py-4">Isla</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución / Método</th>
                                    <th class="px-6 py-4">Versión</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.natId] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.natId).includes(searchQuery) || String(poke.regionalId).includes(searchQuery);
                const matchesZone = (zoneFilter === 'all' || poke.zone === zoneFilter);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesZone && matchesFilter;
            });

            filteredPokedex.forEach((poke) => {
                const isCaught = caughtState[poke.natId] || false;
                let badges = '';
                [{ name: 'Pokémon Sol', color: 'bg-amber-100 text-amber-800 border-amber-300' }, { name: 'Pokémon Luna', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' }].forEach(g => {
                    if (isAvailableInGame(poke.natId, g.name)) {
                        badges += `<button onclick="navigate('${g.name}')" class="px-2 py-1 text-xs border rounded-md font-semibold mr-1 transition hover:opacity-70 ${g.color}">${g.name}</button>`;
                    }
                });
                if (badges === '') badges = `<span class="text-xs text-gray-400 italic">Ambas versiones</span>`;

                html += `
                    <tr class="hover:bg-gray-50 transition duration-150 ${isCaught ? 'bg-amber-50/50' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-amber-600 rounded border-gray-300 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.natId})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono font-bold text-amber-900">#${String(poke.regionalId).padStart(3, '0')}</td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.natId).padStart(3, '0')}</td>
                        <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-800">${poke.zone}</span></td>
                        <td class="px-6 py-2"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.natId}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain" onerror="this.style.display='none'"></td>
                        <td class="px-6 py-4 font-bold text-base"><a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:underline">${poke.name}</a></td>
                        <td class="px-6 py-4 text-sm font-medium text-amber-700">${poke.evo}</td>
                        <td class="px-6 py-4">${badges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            let headerStyles = gameName === 'Pokémon Sol' ? 'bg-amber-600 text-white' : 'bg-indigo-600 text-white';

            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/20 mb-8">
                        <div class="p-8 ${headerStyles}">
                            <h1 class="text-4xl font-extrabold mb-2">Edición ${gameName}</h1>
                            <p class="text-lg opacity-90">Detalle de rutas, islas y encuentros específicos de Alola.</p>
                        </div>
                    </div>
                    <div class="space-y-8">
            `;

            routes.forEach(route => {
                html += `
                    <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-md overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                            <h2 class="text-xl font-bold text-gray-800">${route.name}</h2>
                        </div>
                        <div class="p-0 overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-gray-100/50 text-gray-600 text-xs uppercase font-semibold">
                                    <tr>
                                        <th class="px-6 py-3 w-16 text-center">Atrapado</th>
                                        <th class="px-6 py-3">Pokémon</th>
                                        <th class="px-6 py-3">Ratio</th>
                                        <th class="px-6 py-3">Método / Ubicación Exacta</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                `;
                route.encounters.forEach(encounter => {
                    const pokeName = getPokemonName(encounter.id);
                    const isCaught = caughtState[encounter.id] || false;
                    html += `
                        <tr class="hover:bg-gray-50/80 transition ${isCaught ? 'bg-amber-50/20' : ''}">
                            <td class="px-6 py-3 text-center">
                                <input type="checkbox" class="w-5 h-5 text-amber-600 rounded border-gray-300 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                            </td>
                            <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                <span><a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-blue-600 hover:underline">${pokeName}</a> <span class="text-xs text-gray-400 font-mono">#${encounter.id}</span></span>
                            </td>
                            <td class="px-6 py-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">${encounter.rate}</span></td>
                            <td class="px-6 py-3 text-gray-600">${encounter.method}</td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div></div>`;
            });
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const firebaseConfig = JSON.parse(window.__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                const userCred = await signInAnonymously(auth);
                userId = userCred.user.uid;
                document.getElementById('storage-status').innerText = "Rotom-Dex conectada a Firebase.";
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        caughtState = { ...JSON.parse(localStorage.getItem('alolaTrackerData') || '{}'), ...docSnap.data() };
                        renderCurrentView();
                    } else {
                        caughtState = JSON.parse(localStorage.getItem('alolaTrackerData') || '{}');
                        setDoc(docRef, caughtState);
                        renderCurrentView();
                    }
                });
            } catch (e) {
                caughtState = JSON.parse(localStorage.getItem('alolaTrackerData') || '{}');
                document.getElementById('storage-status').innerText = "Modo Local activo.";
                renderCurrentView();
            }
        }
        setupCloudStorage();
    </script>
</body>
</html>
