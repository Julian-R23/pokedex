                { name: "Regalos y Eventos", encounters: [{ id: 131, rate: "100%", method: "Silph S.A." }, { id: 133, rate: "100%", method: "Mansión Azulona" }, { id: 106, rate: "Elegir", method: "Dojo Kárate" }, { id: 107, rate: "Elegir", method: "Dojo Kárate" }, { id: 138, rate: "Elegir", method: "Monte Moon (Fósil)" }, { id: 140, rate: "Elegir", method: "Monte Moon (Fósil)" }, { id: 142, rate: "100%", method: "Museo Plateado (Ámbar)" }, { id: 143, rate: "100%", method: "Rutas 12 y 16" }] },
                { name: "Islas Sete 1-3 (Pre-Nacional)", encounters: [{ id: 77, rate: "Común", method: "Camino Candente" }, { id: 78, rate: "Poco común", method: "Camino Candente" }, { id: 96, rate: "Común", method: "Bosque Baya" }, { id: 97, rate: "Poco común", method: "Bosque Baya" }, { id: 52, rate: "Común", method: "Cabo Extremo" }, { id: 53, rate: "Poco común", method: "Cabo Extremo" }] },
                { name: "Islas Sete 4-7 (Post-Game VH)", encounters: [{ id: 161, rate: "Común", method: "Valle Ruinas" }, { id: 163, rate: "Común", method: "Bosque Baya" }, { id: 165, rate: "Común", method: "Bosque Baya" }, { id: 175, rate: "Regalo", method: "Laberinto Acuático (Huevo)" }, { id: 177, rate: "Común", method: "Valle Ruinas" }, { id: 183, rate: "Común (VH)", method: "Cueva Glaciada (Surf)" }, { id: 187, rate: "Común", method: "Vía Acuática" }, { id: 191, rate: "Común", method: "Prado Isla Quarta" }, { id: 193, rate: "Raro", method: "Bosque Baya" }, { id: 194, rate: "Común", method: "Cueva Glaciada" }, { id: 200, rate: "Común (VH)", method: "Cueva Perdida" }, { id: 201, rate: "Común", method: "Cámara de los Unown" }, { id: 202, rate: "Común", method: "Ruinas Sete" }, { id: 206, rate: "Común", method: "Puerto Tres" }, { id: 215, rate: "Raro (VH)", method: "Cueva Glaciada" }, { id: 218, rate: "Común", method: "Monte Ascuas" }, { id: 220, rate: "Común", method: "Cueva Glaciada" }, { id: 222, rate: "Raro", method: "Vía Acuática" }, { id: 226, rate: "Raro (VH)", method: "Ruinas Sete (Surf)" }, { id: 246, rate: "Raro", method: "Cañón Sétano" }] },
                { name: "Legendarios y Errantes", encounters: [{ id: 144, rate: "Único", method: "Islas Espuma" }, { id: 145, rate: "Único", method: "Central Energía" }, { id: 146, rate: "Único", method: "Monte Ascuas" }, { id: 150, rate: "Único", method: "Cueva Celeste" }, { id: 243, rate: "Errante Kanto", method: "Si inicial fue Squirtle" }, { id: 244, rate: "Errante Kanto", method: "Si inicial fue Bulbasaur" }, { id: 245, rate: "Errante Kanto", method: "Si inicial fue Charmander" }] }
            ]
        };
        let caughtState = {}; 
        let currentView = 'pokedex';
        let searchQuery = '';
        let filterState = 'all'; 
        
        let db, auth, userId;
        const appId = 'kanto-remakes-tracker';

        // Generador de enlace de Wikidex
        function getWikidexUrl(name) {
            const safeName = name.replace(/ /g, '_');
            return `https://www.wikidex.net/wiki/${safeName}`;
        }

        function getPokemonName(id) {
            const p = pokedex.find(p => p.id === id);
            return p ? p.name : `Desconocido (${id})`;
        }

        function isAvailableInGame(pokemonId, gameName) {
            if (!routeData[gameName]) return false;
            for (let route of routeData[gameName]) {
                if (route.encounters.some(e => e.id === pokemonId)) return true;
            }
            return false;
        }

        window.toggleCaught = async function(pokemonId) {
            caughtState[pokemonId] = !caughtState[pokemonId];
            renderCurrentView(); 
            localStorage.setItem('kantoRemakesTrackerData', JSON.stringify(caughtState));
            
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) { console.error("Error:", error); }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-slate-700'));
            document.getElementById(`nav-${viewName}`).classList.add('bg-slate-700');
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) {
            searchQuery = value.toLowerCase();
            renderCurrentView();
        }

        window.updateFilter = function(value) {
            filterState = value;
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {
                container.innerHTML = generatePokedexHTML();
                document.body.className = "bg-gray-100 text-gray-800 min-h-screen flex flex-col game-bg-pokedex";
            } else {
                container.innerHTML = generateGamePageHTML(currentView);
                const bgColors = { 'Rojo Fuego': 'game-bg-firered', 'Verde Hoja': 'game-bg-leafgreen' };
                document.body.className = `text-gray-800 min-h-screen flex flex-col ${bgColors[currentView]}`;
            }
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                    <div class="p-6 bg-slate-800 text-white border-b border-gray-700">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3">
                            Kanto + Islas Sete
                            <span class="text-sm font-normal bg-orange-600 px-3 py-1 rounded-full text-orange-100">
                                ${totalCaught} / ${pokedex.length} Atrapados
                            </span>
                        </h1>
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-orange-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="mt-6 flex flex-col sm:flex-row gap-4">
                            <input type="text" placeholder="Buscar por nombre o número..." class="px-4 py-2 rounded-lg text-gray-800 w-full sm:w-1/2 focus:ring-2 focus:ring-orange-500 outline-none" value="${searchQuery}" onkeyup="updateSearch(this.value)">
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-orange-500 outline-none cursor-pointer" onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos los Pokémon</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Solo Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600 font-bold">
                                <tr>
                                    <th class="px-6 py-4 text-center">Atrapado</th>
                                    <th class="px-6 py-4 text-center">Nº</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución</th>
                                    <th class="px-6 py-4">Versión Destacada</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.id] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.id).includes(searchQuery);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesFilter;
            });

            if (filteredPokedex.length === 0) {
                html += `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">No se encontraron Pokémon.</td></tr>`;
            }

            filteredPokedex.forEach(poke => {
                const isCaught = caughtState[poke.id] || false;
                let badges = '';
                const games = [
                    { name: 'Rojo Fuego', color: 'bg-red-100 text-red-700 border-red-300' },
                    { name: 'Verde Hoja', color: 'bg-green-100 text-green-700 border-green-300' }
                ];

                games.forEach(g => {
                    if (isAvailableInGame(poke.id, g.name)) {
                        badges += `<button onclick="navigate('${g.name}')" class="px-2 py-1 text-xs border rounded-md font-semibold mr-2 transition hover:opacity-70 ${g.color}">${g.name}</button>`;
                    }
                });

                if (badges === '') badges = `<span class="text-xs text-gray-400 italic">Otras rutas/Evolución</span>`;

                html += `
                    <tr class="hover:bg-gray-50 transition duration-150 ${isCaught ? 'bg-orange-50/50' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-orange-600 rounded border-gray-300 focus:ring-orange-500 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.id})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.id).padStart(3, '0')}</td>
                        <td class="px-6 py-2">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.id}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain pixelated" onerror="this.style.display='none'">
                        </td>
                        <td class="px-6 py-4 font-bold text-base">
                            <a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${poke.name}</a>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium text-orange-700">${poke.evo}</td>
                        <td class="px-6 py-4">${badges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            let headerStyles = '';
            if (gameName === 'Rojo Fuego') headerStyles = 'bg-orange-500 text-white';
            if (gameName === 'Verde Hoja') headerStyles = 'bg-green-600 text-white';

            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/20 mb-8">
                        <div class="p-8 ${headerStyles}">
                            <h1 class="text-4xl font-extrabold mb-2">Edición ${gameName}</h1>
                            <p class="text-lg opacity-90">Lugares clave y exclusivos (Incluye Post-Game Islas Sete).</p>
                        </div>
                    </div>
                    <div class="space-y-8">
            `;

            if (!routes || routes.length === 0) {
                html += `<p class="text-center text-gray-600 py-10 bg-white/50 rounded-xl">Datos no disponibles.</p>`;
            } else {
                routes.forEach(route => {
                    html += `
                        <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-md overflow-hidden">
                            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                                <h2 class="text-xl font-bold text-gray-800">${route.name}</h2>
                            </div>
                            <div class="p-0 overflow-x-auto">
                                <table class="w-full text-left text-sm whitespace-nowrap">
                                    <thead class="bg-gray-100/50 text-gray-600 text-xs uppercase font-semibold">
                                        <tr>
                                            <th class="px-6 py-3 w-16 text-center">Atrapado</th>
                                            <th class="px-6 py-3">Pokémon</th>
                                            <th class="px-6 py-3">Ratio</th>
                                            <th class="px-6 py-3">Método / Ubicación</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                    `;

                    route.encounters.forEach(encounter => {
                        const pokeName = getPokemonName(encounter.id);
                        const isCaught = caughtState[encounter.id] || false;
                        
                        html += `
                            <tr class="hover:bg-gray-50/80 transition ${isCaught ? 'bg-orange-50/20' : ''}">
                                <td class="px-6 py-3 text-center">
                                    <input type="checkbox" class="w-5 h-5 text-orange-600 rounded border-gray-300 cursor-pointer checkbox-anim focus:ring-orange-500" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                                </td>
                                <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                    <span>
                                        <a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${pokeName}</a> 
                                        <span class="text-xs text-gray-400 font-mono ml-1">#${encounter.id}</span>
                                    </span>
                                </td>
                                <td class="px-6 py-3"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">${encounter.rate}</span></td>
                                <td class="px-6 py-3 text-gray-600">${encounter.method}</td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table></div></div>`;
                });
            }
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const localData = localStorage.getItem('kantoRemakesTrackerData');
                if (localData) {
                    caughtState = JSON.parse(localData);
                    renderCurrentView();
                }

                if (typeof __firebase_config === 'undefined') return;
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);

                    // Sistema de sincronización por código
                    let mySyncCode = localStorage.getItem('pokemonSyncCode');
                    if (!mySyncCode) {
                        mySyncCode = prompt("Ingresa una palabra secreta para sincronizar tu progreso entre dispositivos (ej. JulianDex2026):");
                        if (mySyncCode) {
                            localStorage.setItem('pokemonSyncCode', mySyncCode.trim());
                        }
                    }

                    // Usamos tu palabra secreta como ID principal, o el anónimo si cancelas
                    userId = mySyncCode ? mySyncCode.trim() : auth.currentUser?.uid;
                    if (!userId) return;
                }

                document.getElementById('storage-status').textContent = "RF/VH Tracker - Conectado al PC de Bill (Nube activa).";
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        caughtState = { ...caughtState, ...snapshot.data() };
                        renderCurrentView();
                    }
                });
            } catch (error) {
                document.getElementById('storage-status').textContent = "RF/VH Tracker - Guardado de manera local en tu Pokédex.";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            navigate('pokedex');
            setupCloudStorage();
        });
    </script>
</body>
</html>
