        function getWikidexUrl(name) {
            const cleanName = name.split('/')[0].trim();
            return `https://www.wikidex.net/wiki/${cleanName.replace(/ /g, '_')}`;
        }

        function getPokemonName(id) {
            return pokedexNames[id] || `Pokémon #${id}`;
        }

        window.toggleCaught = async function(natId) {
            caughtState[natId] = !caughtState[natId];
            renderCurrentView(); 
            localStorage.setItem('kalosTrackerData', JSON.stringify(caughtState));
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) { console.error("Error:", error); }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-white');
            });
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) activeBtn.classList.add('bg-slate-800', 'text-white');
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) { searchQuery = value.toLowerCase(); renderCurrentView(); }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {

                container.innerHTML = generateEncountersHTML();
            } else if (currentView === 'Exclusivos') {

            }

        function generateEncountersHTML() {

                    <div class="rounded-xl shadow-lg border border-slate-700 bg-slate-800 p-6 sm:p-8">

                    </div>
            `;

            const filteredLocations = allLocationsEncounters.filter(loc => {
                const matchesLoc = loc.locationName.toLowerCase().includes(searchQuery);
                const matchesMon = loc.encounters.some(e => getPokemonName(e.id).toLowerCase().includes(searchQuery));
                return matchesLoc || matchesMon;
            });

            filteredLocations.forEach(loc => {
                html += `
                    <div class="bg-slate-800 rounded-xl shadow-md border border-slate-700 overflow-hidden">
                        <div class="px-6 py-4 bg-slate-950 border-b border-slate-700">
                            <h2 class="text-xl font-bold text-sky-400">${loc.locationName}</h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap border-collapse">
                                <thead class="bg-slate-900 text-slate-400 text-xs uppercase font-semibold border-b border-slate-700">
                                    <tr>
                                        <th class="px-4 py-3 w-16 text-center">Atrapar</th>
                                        <th class="px-6 py-3">Pokémon</th>
                                        <th class="px-4 py-3 text-center" colspan="2">Games</th>
                                        <th class="px-6 py-3 text-center">Location</th>
                                        <th class="px-6 py-3 text-center">Levels</th>
                                        <th class="px-6 py-3 text-center">Rate</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-700/50">
                `;

                loc.encounters.forEach(encounter => {
                    const pokeName = getPokemonName(encounter.id);
                    const isCaught = caughtState[encounter.id] || false;

                    const classX = encounter.inX ? 'game-badge-x-active' : 'game-badge-x-inactive';
                    const classY = encounter.inY ? 'game-badge-y-active' : 'game-badge-y-inactive';

                    html += `
                        <tr class="hover:bg-slate-700/50 transition ${isCaught ? 'bg-sky-950/30' : ''}">
                            <td class="px-4 py-3 text-center">
                                <input type="checkbox" class="w-5 h-5 text-sky-500 rounded border-slate-600 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                            </td>
                            <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                <span><a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-sky-400 hover:underline">${pokeName}</a></span>
                            </td>
                            <td class="px-1 py-3 text-center w-8">
                                <span class="px-2.5 py-1 text-xs font-black rounded ${classX}">X</span>
                            </td>
                            <td class="px-1 py-3 text-center w-8">
                                <span class="px-2.5 py-1 text-xs font-black rounded ${classY}">Y</span>
                            </td>
                            <td class="px-6 py-3 text-center text-slate-300 font-medium">${encounter.location}</td>
                            <td class="px-6 py-3 text-center text-slate-300 font-mono">${encounter.levels}</td>
                            <td class="px-6 py-3 text-center font-bold text-sky-400 font-mono">${encounter.rate}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div></div>`;
            });

            html += `</div>`;
            return html;
        }

                    <tr class="hover:bg-slate-700/50 transition ${isCaught ? 'bg-sky-950/30' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-sky-500 rounded border-slate-600 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${id})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono font-bold text-sky-400">#${String(id).padStart(3, '0')}</td>
                        <td class="px-6 py-2"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" alt="${pokeName}" class="w-12 h-12 inline-block object-contain" onerror="this.style.display='none'"></td>
                        <td class="px-6 py-4 font-bold text-base"><a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-sky-400 hover:underline">${pokeName}</a></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateExclusivesHTML() {
            let html = `
                <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700 p-8">
                    <h1 class="text-3xl font-extrabold mb-6 text-white">Pokémon Exclusivos por Versión</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            `;
            for (const [version, list] of Object.entries(versionExclusives)) {
                let badgeColor = version === 'Pokémon X' ? 'bg-sky-600' : 'bg-rose-600';
                html += `
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-6 shadow-sm">
                        <h2 class="text-2xl font-bold mb-4 text-white p-3 rounded-lg ${badgeColor}">${version}</h2>
                        <ul class="space-y-3">
                `;
                list.forEach(item => {
                    html += `
                        <li class="flex justify-between items-center bg-slate-800 p-3 rounded-lg border border-slate-700">
                            <span class="font-bold text-slate-200">${item.name}</span>
                            <span class="text-xs text-slate-400 bg-slate-900 px-2 py-1 rounded">${item.note}</span>
                        </li>
                    `;
                });
                html += `</ul></div>`;
            }
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const firebaseConfig = JSON.parse(window.__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                const userCred = await signInAnonymously(auth);
                userId = userCred.user.uid;
                document.getElementById('storage-status').innerText = "Holomisor conectado a Firebase.";
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        caughtState = { ...JSON.parse(localStorage.getItem('kalosTrackerData') || '{}'), ...docSnap.data() };
                        renderCurrentView();
                    } else {
                        caughtState = JSON.parse(localStorage.getItem('kalosTrackerData') || '{}');
                        setDoc(docRef, caughtState);
                        renderCurrentView();
                    }
                });
            } catch (e) {
                caughtState = JSON.parse(localStorage.getItem('kalosTrackerData') || '{}');
                document.getElementById('storage-status').innerText = "Modo Local activo.";
                renderCurrentView();
            }
        }
        setupCloudStorage();
    </script>
</body>
</html>
