                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200 p-8">
                    <h1 class="text-3xl font-extrabold mb-6 text-slate-900">Pokémon Exclusivos por Versión</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            `;
            for (const [version, list] of Object.entries(versionExclusives)) {
                let badgeColor = version === 'Pokémon X' ? 'bg-sky-600' : 'bg-rose-600';
                html += `
                    <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 shadow-sm">
                        <h2 class="text-2xl font-bold mb-4 text-white p-3 rounded-lg ${badgeColor}">${version}</h2>
                        <ul class="space-y-3">
                `;
                list.forEach(item => {
                    html += `
                        <li class="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-100 shadow-xs">
                            <span class="font-bold text-slate-800">${item.name}</span>
                            <span class="text-xs text-slate-500 bg-gray-100 px-2 py-1 rounded">${item.note}</span>
                        </li>
                    `;
                });
                html += `</ul></div>`;
            }
            html += `</div></div>`;
            return html;
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                    <div class="p-6 bg-slate-800 text-white border-b border-gray-700">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3">
                            Pokédex Regional Kalos
                            <span class="text-sm font-normal bg-sky-600 px-3 py-1 rounded-full text-sky-100">
                                ${totalCaught} / ${pokedex.length} Registrados
                            </span>
                        </h1>
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-sky-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <input type="text" placeholder="Buscar Pokémon..." class="px-4 py-2 rounded-lg text-gray-800 w-full focus:ring-2 focus:ring-sky-500 outline-none" value="${searchQuery}" onkeyup="updateSearch(this.value)">
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer" onchange="updateZoneFilter(this.value)">
                                <option value="all" ${zoneFilter === 'all' ? 'selected' : ''}>Todas las Zonas</option>
                                <option value="Centro" ${zoneFilter === 'Centro' ? 'selected' : ''}>Kalos Centro</option>
                                <option value="Costa" ${zoneFilter === 'Costa' ? 'selected' : ''}>Kalos Costa</option>
                                <option value="Montaña" ${zoneFilter === 'Montaña' ? 'selected' : ''}>Kalos Montaña</option>
                            </select>
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer" onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600 font-bold">
                                <tr>
                                    <th class="px-6 py-4 text-center">Atrapado</th>
                                    <th class="px-6 py-4 text-center">Nº Reg.</th>
                                    <th class="px-6 py-4 text-center">Nº Nac.</th>
                                    <th class="px-6 py-4">Zona</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.natId] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.natId).includes(searchQuery);
                const matchesZone = (zoneFilter === 'all' || poke.zone === zoneFilter);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesZone && matchesFilter;
            });

            filteredPokedex.forEach((poke) => {
                const isCaught = caughtState[poke.natId] || false;
                html += `
                    <tr class="hover:bg-gray-50 transition duration-150 ${isCaught ? 'bg-sky-50/50' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-sky-600 rounded border-gray-300 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.natId})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono font-bold text-sky-900">#${String(poke.regionalId).padStart(3, '0')}</td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.natId).padStart(3, '0')}</td>
                        <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-800">${poke.zone}</span></td>
                        <td class="px-6 py-2"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.natId}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain" onerror="this.style.display='none'"></td>
                        <td class="px-6 py-4 font-bold text-base"><a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:underline">${poke.name}</a></td>
                        <td class="px-6 py-4 text-sm font-medium text-sky-700">${poke.evo}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            let headerStyles = gameName === 'Pokémon X' ? 'bg-sky-600 text-white' : 'bg-rose-600 text-white';

            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/20 mb-8">
                        <div class="p-8 ${headerStyles}">
                            <h1 class="text-4xl font-extrabold mb-2">Edición ${gameName}</h1>
                            <p class="text-lg opacity-90">Formato de encuentros idéntico a Bulbapedia (Pokémon, Games, Location, Levels, Rate).</p>
                        </div>
                    </div>
                    <div class="space-y-8">
            `;

            routes.forEach(route => {
                html += `
                    <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-md overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                            <h2 class="text-xl font-bold text-gray-800">${route.name}</h2>
                        </div>
                        <div class="p-0 overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-gray-100/50 text-gray-600 text-xs uppercase font-semibold">
                                    <tr>
                                        <th class="px-4 py-3 w-16 text-center">Atrapar</th>
                                        <th class="px-4 py-3">Pokémon</th>
                                        <th class="px-4 py-3 text-center">Games</th>
                                        <th class="px-4 py-3">Location</th>
                                        <th class="px-4 py-3">Levels</th>
                                        <th class="px-4 py-3">Rate</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                `;
                route.encounters.forEach(encounter => {
                    const pokeName = getPokemonName(encounter.id);
                    const isCaught = caughtState[encounter.id] || false;
                    html += `
                        <tr class="hover:bg-gray-50/80 transition ${isCaught ? 'bg-sky-50/20' : ''}">
                            <td class="px-4 py-3 text-center">
                                <input type="checkbox" class="w-5 h-5 text-sky-600 rounded border-gray-300 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                            </td>
                            <td class="px-4 py-3 font-semibold flex items-center gap-3">
                                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                <span><a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-blue-600 hover:underline">${pokeName}</a></span>
                            </td>
                            <td class="px-4 py-3 text-center">
                                <span class="px-2 py-1 text-xs font-bold text-white bg-blue-600 rounded">X</span>
                                <span class="px-2 py-1 text-xs font-bold text-white bg-red-600 rounded">Y</span>
                            </td>
                            <td class="px-4 py-3 text-gray-700 font-medium">${encounter.method}</td>
                            <td class="px-4 py-3 text-gray-600">${encounter.level}</td>
                            <td class="px-4 py-3 font-semibold text-sky-900">${encounter.rate}</td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div></div>`;
            });
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const firebaseConfig = JSON.parse(window.__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                const userCred = await signInAnonymously(auth);
                userId = userCred.user.uid;
                document.getElementById('storage-status').innerText = "Holomisor conectado a Firebase.";
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        caughtState = { ...JSON.parse(localStorage.getItem('kalosTrackerData') || '{}'), ...docSnap.data() };
                        renderCurrentView();
                    } else {
                        caughtState = JSON.parse(localStorage.getItem('kalosTrackerData') || '{}');
                        setDoc(docRef, caughtState);
                        renderCurrentView();
                    }
                });
            } catch (e) {
                caughtState = JSON.parse(localStorage.getItem('kalosTrackerData') || '{}');
                document.getElementById('storage-status').innerText = "Modo Local activo.";
                renderCurrentView();
            }
        }
        setupCloudStorage();
    </script>
</body>
</html>
