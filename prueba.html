            { id: 460, name: "Abomasnow", category: "Megaevolución", variants: ["Mega Abomasnow"], note: "Disponible en Pokémon X/Y con la Megapiedra correspondiente." }
        ];

        function getWikidexUrl(name) {
            const cleanName = name.split('/')[0].trim();
            return `https://www.wikidex.net/wiki/${cleanName.replace(/ /g, '_')}`;
        }

        // Nombres de Pokémon que aparecen en encuentros pero no están en la Pokédex regional cargada
        const extraNames = {"559":"Scraggy", "309":"Electrike", "434":"Stunky", "339":"Barboach", "625":"Bisharp", "618":"Stunfisk", "186":"Politoed", "340":"Whiscash", "207":"Gligar","307": "Meditite", "293": "Whismur", "610": "Axew", "66": "Machop", "95": "Onix", "104": "Cubone", "111": "Rhyhorn", "115": "Kangaskhan", "303": "Mawile", "337": "Lunatone", "338": "Solrock", "557": "Dwebble", "696": "Tyrunt", "698": "Amaura", "122": "Mr. Mime", "202": "Wobbuffet", "302": "Sableye", "433": "Chingling", "524": "Roggenrola", "577": "Solosis", "703": "Carbink", "79": "Slowpoke", "102": "Exeggcute", "441": "Chatot", "686": "Inkay", "370": "Luvdisc", "170": "Chinchou", "223": "Remoraid", "171": "Lanturn", "224": "Octillery", "594": "Alomomola", "72": "Tentacool", "131": "Lapras", "458": "Mantyke", "688": "Binacle", "82": "Magneton", "101": "Electrode", "607": "Litwick", "624": "Pawniard", "707": "Klefki", "93": "Haunter", "124": "Jynx", "221": "Piloswine", "614": "Beartic", "615": "Cryogonal", "712": "Bergmite", "60": "Poliwag", "61": "Poliwhirl", "550": "Basculin", "419": "Floatzel", "28": "Sandslash", "75": "Graveler", "247": "Pupitar", "305": "Lairon", "632": "Durant", "213": "Shuckle", "39": "Jigglypuff", "132": "Ditto", "164": "Noctowl", "571": "Zoroark", "575": "Gothorita", "591": "Amoonguss", "271": "Lombre", "718": "Zygarde", "150": "Mewtwo", "569": "Garbodor", "479": "Rotom"};
        
        function getPokemonName(id) {
            const p = pokedex.find(p => p.natId === id);
            return p ? p.name : (extraNames[id] || `Pokémon #${id}`);
        }

        window.toggleCaught = async function(natId) {
            caughtState[natId] = !caughtState[natId];
            renderCurrentView(); 
            localStorage.setItem('kalosTrackerData', JSON.stringify(caughtState));
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) { console.error("Error:", error); }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-white');
            });
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) activeBtn.classList.add('bg-slate-800', 'text-white');
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) { searchQuery = value.toLowerCase(); renderCurrentView(); }
        window.updateFilter = function(value) { filterState = value; renderCurrentView(); }
        window.updateZoneFilter = function(value) { zoneFilter = value; renderCurrentView(); }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {
                container.innerHTML = generatePokedexHTML();
            } else if (currentView === 'encounters') {
                container.innerHTML = generateEncountersHTML();
            } else if (currentView === 'Exclusivos') {
                container.innerHTML = generateExclusivesHTML();
            }
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            // El total ahora es 457 (153+153+151)
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700">
                    <div class="p-6 bg-slate-900 text-white border-b border-slate-700">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3">
                            Pokédex Regional Kalos
                            <span class="text-sm font-normal bg-sky-600 px-3 py-1 rounded-full text-sky-100">
                                ${totalCaught} / ${pokedex.length} Registrados
                            </span>
                        </h1>
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-sky-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="flex flex-wrap gap-3 mt-6">
                            <span class="px-4 py-2 rounded-lg font-semibold bg-sky-600 text-white">Pokédex regional</span>
                            <span class="text-sm text-slate-400 self-center">Pulsa el nombre de un Pokémon con el símbolo ▾ para ver sus formas.</span>
                        </div>
                        <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <input type="text" placeholder="Buscar Pokémon..." class="px-4 py-2 rounded-lg bg-slate-950 text-white w-full border border-slate-700 focus:ring-2 focus:ring-sky-500 outline-none" value="${searchQuery}" onkeyup="updateSearch(this.value)">
                            <select class="px-4 py-2 rounded-lg bg-slate-950 text-white border border-slate-700 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer" onchange="updateZoneFilter(this.value)">
                                <option value="all" ${zoneFilter === 'all' ? 'selected' : ''}>Todas las Zonas</option>
                                <option value="Centro" ${zoneFilter === 'Centro' ? 'selected' : ''}>Kalos Centro</option>
                                <option value="Costa" ${zoneFilter === 'Costa' ? 'selected' : ''}>Kalos Costa</option>
                                <option value="Montaña" ${zoneFilter === 'Montaña' ? 'selected' : ''}>Kalos Montaña</option>
                            </select>
                            <select class="px-4 py-2 rounded-lg bg-slate-950 text-white border border-slate-700 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer" onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b border-slate-700 bg-slate-900 text-slate-400 font-bold">
                                <tr>
                                    <th class="px-3 py-4 w-12 text-center" title="Formas">Formas</th>
                                    <th class="px-6 py-4 text-center">Atrapado</th>
                                    <th class="px-6 py-4 text-center">Nº Reg.</th>
                                    <th class="px-6 py-4 text-center">Nº Nac.</th>
                                    <th class="px-6 py-4">Zona</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.natId] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.natId).includes(searchQuery);
                const matchesZone = (zoneFilter === 'all' || poke.zone === zoneFilter);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesZone && matchesFilter;
            });

            filteredPokedex.forEach((poke) => {
                const isCaught = caughtState[poke.natId] || false;
                html += `
                    <tr class="hover:bg-slate-700/50 transition ${isCaught ? 'bg-sky-950/30' : ''}">
                        <td class="px-3 py-4 text-center">
                            ${getPokemonFormGroups(poke.natId).length ? `<button type="button" onclick="togglePokemonForms(${poke.natId})" class="w-8 h-8 rounded-md bg-violet-900/50 text-violet-200 hover:bg-violet-700 hover:text-white font-bold transition" title="Mostrar u ocultar formas" aria-label="Mostrar u ocultar formas de ${poke.name}">${expandedPokemonId === poke.natId ? '▾' : '▸'}</button>` : ''}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-sky-500 rounded border-slate-600 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.natId})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono font-bold text-sky-400">#${String(poke.regionalId).padStart(3, '0')}</td>
                        <td class="px-6 py-4 text-center font-mono text-slate-400">#${String(poke.natId).padStart(3, '0')}</td>
                        <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-700 text-slate-200">${poke.zone}</span></td>
                        <td class="px-6 py-2"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.natId}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain" onerror="this.style.display='none'"></td>
                        <td class="px-6 py-4 font-bold text-base">
                            <a href="${getWikidexUrl(poke.name)}" target="_blank" rel="noopener" class="text-sky-400 hover:underline">${poke.name}</a>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium text-sky-300">${poke.evo}</td>
                    </tr>
                    ${expandedPokemonId === poke.natId && getPokemonFormGroups(poke.natId).length ? `
                        <tr class="bg-slate-950/70 border-b border-slate-700">
                            <td colspan="8" class="px-6 py-5">
                                <div class="rounded-xl border border-violet-500/30 bg-slate-900 p-4">
                                    <h3 class="text-lg font-bold text-violet-200 mb-3">Formas y diferencias de ${poke.name}</h3>
                                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        ${getPokemonFormGroups(poke.natId).map(group => `
                                            <section class="rounded-lg bg-slate-800 p-4">
                                                <h4 class="font-semibold text-sky-200 mb-1">${group.category}</h4>
                                                <p class="text-xs text-slate-400 mb-3">${group.note}</p>
                                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    ${group.variants.map(v => {
                                                        const key = `${group.id}:${group.name}:${v}`;
                                                        const checked = !!formState[key];
                                                        return `<label class="flex items-center gap-2 rounded-lg p-2 ${checked ? 'bg-violet-950/60' : 'bg-slate-900'} cursor-pointer hover:bg-slate-700">
                                                            <input type="checkbox" class="w-4 h-4 accent-violet-500" ${checked ? 'checked' : ''} onchange="toggleFormCaught(${JSON.stringify(key).replace(/"/g, '&quot;')})">
                                                            <span class="text-sm ${checked ? 'text-violet-200' : 'text-slate-200'}">${v}</span>
                                                        </label>`;
                                                    }).join('')}
                                                </div>
                                            </section>
                                        `).join('')}
                                    </div>
                                </div>
                            </td>
                        </tr>` : ''}
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function getPokemonFormGroups(natId) {
            return pokemonForms.filter(p => Number(p.id) === Number(natId) && !/variocolor/i.test(p.category));
        }

        window.togglePokemonForms = function(natId) {
            expandedPokemonId = expandedPokemonId === Number(natId) ? null : Number(natId);
            renderCurrentView();
        };

        window.setPokedexSubView = function(view) {
            pokedexSubView = view;
            renderCurrentView();
        };

        window.updateFormSearch = function(value) {
            formSearchQuery = value.toLowerCase();
            renderCurrentView();
        };

        window.toggleFormCaught = async function(formKey) {
            formState[formKey] = !formState[formKey];
            localStorage.setItem('kalosTrackerForms', JSON.stringify(formState));
            renderCurrentView();
            if (db && userId) {
                try {
                    const formDoc = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'formState');
                    await setDoc(formDoc, formState);
                } catch (error) {
                    console.error('Error al sincronizar las formas:', error);
                }
            }
        };

        // ... (el resto de funciones: generateEncountersHTML, generateExclusivesHTML, setupCloudStorage, etc. se mantienen igual)
        // Por brevedad, se omiten aquí pero deben copiarse del archivo original.

        // IMPORTANTE: Para que el archivo funcione, debes pegar el resto del código original
        // (generateEncountersHTML, generateExclusivesHTML, setupCloudStorage, etc.)
        // que no ha sido modificado.

    </script>
</body>
</html>
