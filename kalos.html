        function getWikidexUrl(name) {
            const cleanName = name.split('/')[0].trim();
            return `https://www.wikidex.net/wiki/${cleanName.replace(/ /g, '_')}`;
        }

        function getPokemonName(id) {
            const p = pokedex.find(p => p.natId === id);
            return p ? p.name : `Desconocido (${id})`;
        }

        function isAvailableInGame(pokemonId, gameName) {
            if (!routeData[gameName]) return false;
            for (let route of routeData[gameName]) {
                if (route.encounters.some(e => e.id === pokemonId)) return true;
            }
            return false;
        }

            caughtState[natId] = !caughtState[natId];
            renderCurrentView(); 
            localStorage.setItem('kalosTrackerData', JSON.stringify(caughtState));

                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');

                } catch (error) { console.error("Error:", error); }
            }

            window.scrollTo(0, 0);

                const isCaught = caughtState[poke.natId] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.natId).includes(searchQuery) || String(poke.regionalId).includes(searchQuery);
                const matchesZone = (zoneFilter === 'all' || poke.zone === zoneFilter);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesZone && matchesFilter;
            });

            filteredPokedex.forEach((poke) => {
                const isCaught = caughtState[poke.natId] || false;
                let badges = '';
                [{ name: 'Pokémon X', color: 'bg-sky-100 text-sky-800 border-sky-300' }, { name: 'Pokémon Y', color: 'bg-rose-100 text-rose-800 border-rose-300' }].forEach(g => {
                    if (isAvailableInGame(poke.natId, g.name)) {
                        badges += `<button onclick="navigate('${g.name}')" class="px-2 py-1 text-xs border rounded-md font-semibold mr-1 transition hover:opacity-70 ${g.color}">${g.name}</button>`;
                    }
                });
                if (badges === '') badges = `<span class="text-xs text-gray-400 italic">Ambas versiones</span>`;

                html += `
                    <tr class="hover:bg-gray-50 transition duration-150 ${isCaught ? 'bg-sky-50/50' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-sky-600 rounded border-gray-350 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.natId})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono font-bold text-sky-900">#${String(poke.regionalId).padStart(3, '0')}</td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.natId).padStart(3, '0')}</td>
                        <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-800">${poke.zone}</span></td>
                        <td class="px-6 py-2"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.natId}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain" onerror="this.style.display='none'"></td>
                        <td class="px-6 py-4 font-bold text-base"><a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:underline">${poke.name}</a></td>
                        <td class="px-6 py-4 text-sm font-medium text-sky-700">${poke.evo}</td>
                        <td class="px-6 py-4">${badges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            let headerStyles = gameName === 'Pokémon X' ? 'bg-sky-600 text-white' : 'bg-rose-600 text-white';

            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/20 mb-8">
                        <div class="p-8 ${headerStyles}">
                            <h1 class="text-4xl font-extrabold mb-2">Edición ${gameName}</h1>
                            <p class="text-lg opacity-90">Detalle completo de rutas y lugares de encuentro específicos.</p>
                        </div>
                    </div>
                    <div class="space-y-8">
            `;

            routes.forEach(route => {
                html += `
                    <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-md overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                            <h2 class="text-xl font-bold text-gray-800">${route.name}</h2>
                        </div>
                        <div class="p-0 overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-gray-100/50 text-gray-600 text-xs uppercase font-semibold">
                                    <tr>
                                        <th class="px-6 py-3 w-16 text-center">Atrapado</th>
                                        <th class="px-6 py-3">Pokémon</th>
                                        <th class="px-6 py-3">Ratio</th>
                                        <th class="px-6 py-3">Método / Ubicación Exacta</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                `;
                route.encounters.forEach(encounter => {
                    const pokeName = getPokemonName(encounter.id);
                    const isCaught = caughtState[encounter.id] || false;
                    html += `
                        <tr class="hover:bg-gray-50/80 transition ${isCaught ? 'bg-sky-50/20' : ''}">
                            <td class="px-6 py-3 text-center">
                                <input type="checkbox" class="w-5 h-5 text-sky-600 rounded border-gray-300 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                            </td>
                            <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                <span><a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-blue-600 hover:underline">${pokeName}</a> <span class="text-xs text-gray-400 font-mono">#${encounter.id}</span></span>
                            </td>
                            <td class="px-6 py-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">${encounter.rate}</span></td>
                            <td class="px-6 py-3 text-gray-600">${encounter.method}</td>
                        </tr>
                    `;
                });
                html += `</tbody></table></div></div>`;
            });
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const firebaseConfig = JSON.parse(window.__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                const userCred = await signInAnonymously(auth);
                userId = userCred.user.uid;
                document.getElementById('storage-status').innerText = "Holomisor conectado a Firebase.";
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        caughtState = { ...JSON.parse(localStorage.getItem('kalosTrackerData') || '{}'), ...docSnap.data() };
                        renderCurrentView();
                    } else {
                        caughtState = JSON.parse(localStorage.getItem('kalosTrackerData') || '{}');
                        setDoc(docRef, caughtState);
                        renderCurrentView();
                    }
                });
            } catch (e) {
                caughtState = JSON.parse(localStorage.getItem('kalosTrackerData') || '{}');
                document.getElementById('storage-status').innerText = "Modo Local activo.";
                renderCurrentView();
            }
        }
        setupCloudStorage();
    </script>
</body>
</html>
