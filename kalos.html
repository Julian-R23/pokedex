<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración Global de Firebase -->
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalos Tracker (X / Y)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .game-bg-x { background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 50%, #0f172a 100%); }
        .game-bg-y { background: linear-gradient(135deg, #881337 0%, #e11d48 50%, #0f172a 100%); }
        .game-bg-pokedex { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }

        .checkbox-anim:checked { transform: scale(1.1); }

</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-3">
                    <a href="index.html" class="p-2 bg-slate-800 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition" title="Volver al Hub">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </a>
                    <span class="text-xl font-bold tracking-wider cursor-pointer text-sky-400" onclick="navigate('pokedex')">Kalos (Pokémon X / Y)</span>
                </div>
                <div class="flex items-center space-x-1 md:space-x-4 overflow-x-auto">
                    <button onclick="navigate('pokedex')" id="nav-pokedex" class="nav-btn px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 transition whitespace-nowrap">Pokédex Completa</button>
                    <button onclick="navigate('Pokémon X')" id="nav-Pokémon X" class="nav-btn px-3 py-2 rounded-md text-sm font-medium text-sky-400 hover:bg-sky-900 hover:text-white transition whitespace-nowrap">Pokémon X</button>
                    <button onclick="navigate('Pokémon Y')" id="nav-Pokémon Y" class="nav-btn px-3 py-2 rounded-md text-sm font-medium text-rose-400 hover:bg-rose-900 hover:text-white transition whitespace-nowrap">Pokémon Y</button>
                </div>
            </div>
        </div>
    </nav>

    <main id="app-content" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full"></main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm mt-auto">
        <p id="storage-status">Kalos Tracker - Conectando con el Holomisor de la Nube...</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Pokédex de Kalos (Selección Central, Costa y Montaña)
        const rawPokedex = [
            "650|Chespin|Nv. 16", "651|Quilladin|Nv. 36", "652|Chesnaught|Final",
            "653|Fennekin|Nv. 16", "654|Braixen|Nv. 36", "655|Delphox|Final",
            "656|Froakie|Nv. 16", "657|Frogadier|Nv. 36", "658|Greninja|Final",
            "659|Bunnelby|Nv. 20", "660|Diggersby|Final",
            "661|Fletchling|Nv. 17", "662|Fletchinder|Nv. 35", "663|Talonflame|Final",
            "664|Scatterbug|Nv. 9", "665|Spewpa|Nv. 12", "666|Vivillon|Final",
            "667|Litleo|Nv. 35", "668|Pyroar|Final",
            "669|Flabébé|Nv. 19", "670|Floette|P. Día", "671|Florges|Final",
            "672|Skiddo|Nv. 32", "673|Gogoat|Final",
            "674|Pancham|Nv. 32 + Siniestro", "675|Pangoro|Final",
            "676|Furfrou|Final",
            "677|Espurr|Nv. 25", "678|Meowstic|Final",
            "682|Spritzee|Intercambio c/Saquito", "683|Aromatisse|Final",
            "684|Swirlix|Intercambio c/Dulce de Nata", "685|Slurpuff|Final",
            "686|Inkay|Nv. 30 (Consola Invertida)", "687|Malamar|Final",
            "688|Binacle|Nv. 39", "689|Barbaracle|Final",
            "690|Skrelp|Nv. 48", "691|Dragalge|Final",
            "692|Clauncher|Nv. 37", "693|Clawitzer|Final",
            "694|Helioptile|P. Sol", "695|Heliolisk|Final",
            "696|Tyrunt|Nv. 39 (Día)", "697|Tyrantrum|Final",
            "698|Amaura|Nv. 39 (Noche)", "699|Aurorus|Final",
            "700|Sylveon|Amistad + Mov. Hada",
            "701|Hawlucha|Final",
            "702|Dedenne|Final",
            "703|Carbink|Final",
            "704|Goomy|Nv. 40", "705|Sliggoo|Nv. 50 (Lluvia)", "706|Goodra|Final",
            "707|Klefki|Final",
            "708|Phantump|Intercambio", "709|Trevenant|Final",
            "710|Pumpkaboo|Intercambio", "711|Gourgeist|Final",
            "712|Bergmite|Nv. 37", "713|Avalugg|Final",
            "714|Noibat|Nv. 48", "715|Noivern|Final",
            "716|Xerneas|Legendario (X)", "717|Yveltal|Legendario (Y)", "718|Zygarde|Legendario",
            "150|Mewtwo|Legendario", "144|Articuno|Legendario", "145|Zapdos|Legendario", "146|Moltres|Legendario"
        ];

        const pokedex = rawPokedex.map((data) => {
            const [id, name, evo] = data.split('|');
            return { id: parseInt(id), name, evo };
        });

        const routeData = {
            "Pokémon X": [
                { name: "Pueblo Boceto y Rutas 1-3", encounters: [{ id: 650, rate: "Elegir", method: "Inicial" }, { id: 653, rate: "Elegir", method: "Inicial" }, { id: 656, rate: "Elegir", method: "Inicial" }, { id: 659, rate: "Común", method: "Ruta 2-3" }, { id: 661, rate: "Común", method: "Ruta 2-3" }] },
                { name: "Bosque Novarte y Ruta 4", encounters: [{ id: 664, rate: "Común", method: "Bosque Novarte" }, { id: 667, rate: "Común", method: "Ruta 22" }, { id: 669, rate: "Común", method: "Ruta 4" }] },
                { name: "Ciudad Lumalia y Rutas 6-7", encounters: [{ id: 672, rate: "Común", method: "Ruta 5" }, { id: 674, rate: "Común", method: "Ruta 5" }, { id: 676, rate: "Común", method: "Ruta 5" }, { id: 684, rate: "Exclusivo X", method: "Ruta 7" }] },
                { name: "Rutas 8-11 y Fósiles", encounters: [{ id: 686, rate: "Común", method: "Ruta 8" }, { id: 692, rate: "Pesca (Exclusivo X)", method: "Ruta 8" }, { id: 696, rate: "Fósil Garra", method: "Pueblo Petroglifo" }] },
                { name: "Rutas 12-16 y Bahía Azul", encounters: [{ id: 694, rate: "Común", method: "Ruta 9" }, { id: 701, rate: "Común", method: "Ruta 10" }, { id: 704, rate: "Raro", method: "Ruta 14" }, { id: 708, rate: "Común", method: "Ruta 16" }] },
                { name: "Post-Game y Legendarios", encounters: [{ id: 716, rate: "Historia", method: "Guarida Team Flare" }, { id: 718, rate: "Único", method: "Cueva Desenlace" }, { id: 150, rate: "Único", method: "Villa Pokémon" }, { id: 144, rate: "Errante", method: "Cueva Marina" }] }
            ],
            "Pokémon Y": [
                { name: "Pueblo Boceto y Rutas 1-3", encounters: [{ id: 650, rate: "Elegir", method: "Inicial" }, { id: 653, rate: "Elegir", method: "Inicial" }, { id: 656, rate: "Elegir", method: "Inicial" }, { id: 659, rate: "Común", method: "Ruta 2-3" }, { id: 661, rate: "Común", method: "Ruta 2-3" }] },
                { name: "Bosque Novarte y Ruta 4", encounters: [{ id: 664, rate: "Común", method: "Bosque Novarte" }, { id: 667, rate: "Común", method: "Ruta 22" }, { id: 669, rate: "Común", method: "Ruta 4" }] },
                { name: "Ciudad Lumalia y Rutas 6-7", encounters: [{ id: 672, rate: "Común", method: "Ruta 5" }, { id: 674, rate: "Común", method: "Ruta 5" }, { id: 676, rate: "Común", method: "Ruta 5" }, { id: 682, rate: "Exclusivo Y", method: "Ruta 7" }] },
                { name: "Rutas 8-11 y Fósiles", encounters: [{ id: 686, rate: "Común", method: "Ruta 8" }, { id: 690, rate: "Pesca (Exclusivo Y)", method: "Ruta 8" }, { id: 698, rate: "Fósil Aleta", method: "Pueblo Petroglifo" }] },
                { name: "Rutas 12-16 y Bahía Azul", encounters: [{ id: 694, rate: "Común", method: "Ruta 9" }, { id: 701, rate: "Común", method: "Ruta 10" }, { id: 704, rate: "Raro", method: "Ruta 14" }, { id: 708, rate: "Común", method: "Ruta 16" }] },
                { name: "Post-Game y Legendarios", encounters: [{ id: 717, rate: "Historia", method: "Guarida Team Flare" }, { id: 718, rate: "Único", method: "Cueva Desenlace" }, { id: 150, rate: "Único", method: "Villa Pokémon" }, { id: 144, rate: "Errante", method: "Cueva Marina" }] }
            ]
        };

        let caughtState = {}; 
        let currentView = 'pokedex';
        let searchQuery = '';
        let filterState = 'all'; 
        
        let db, auth, userId;
        const appId = 'kalos-tracker'; // ID en Firestore

        function getWikidexUrl(name) {
            const safeName = name.replace(/ /g, '_');
            return `https://www.wikidex.net/wiki/${safeName}`;
        }

        function getPokemonName(id) {
            const p = pokedex.find(p => p.id === id);
            return p ? p.name : `Desconocido (${id})`;
        }

        function isAvailableInGame(pokemonId, gameName) {
            if (!routeData[gameName]) return false;
            for (let route of routeData[gameName]) {
                if (route.encounters.some(e => e.id === pokemonId)) return true;
            }
            return false;
        }

        window.toggleCaught = async function(pokemonId) {
            caughtState[pokemonId] = !caughtState[pokemonId];
            renderCurrentView(); 
            localStorage.setItem('kalosTrackerData', JSON.stringify(caughtState));
            
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) { console.error("Error:", error); }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-slate-700'));
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) activeBtn.classList.add('bg-slate-700');
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) {
            searchQuery = value.toLowerCase();
            renderCurrentView();
        }

        window.updateFilter = function(value) {
            filterState = value;
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {
                container.innerHTML = generatePokedexHTML();
                document.body.className = "bg-gray-100 text-gray-800 min-h-screen flex flex-col game-bg-pokedex";
            } else {
                container.innerHTML = generateGamePageHTML(currentView);
                const bgColors = { 'Pokémon X': 'game-bg-x', 'Pokémon Y': 'game-bg-y' };
                document.body.className = `text-gray-800 min-h-screen flex flex-col ${bgColors[currentView]}`;
            }
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                    <div class="p-6 bg-slate-800 text-white border-b border-gray-700">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3">
                            Pokédex de Kalos (X / Y)
                            <span class="text-sm font-normal bg-sky-600 px-3 py-1 rounded-full text-sky-100">
                                ${totalCaught} / ${pokedex.length} Atrapados
                            </span>
                        </h1>
                        <p class="text-slate-400 mt-2 text-sm">Registro Regional de Kalos.</p>
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-sky-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="mt-6 flex flex-col sm:flex-row gap-4">
                            <input type="text" placeholder="Buscar por nombre o número..." class="px-4 py-2 rounded-lg text-gray-800 w-full sm:w-1/2 focus:ring-2 focus:ring-sky-500 outline-none" value="${searchQuery}" onkeyup="updateSearch(this.value)">
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer" onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos los Pokémon</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Solo Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600 font-bold">
                                <tr>
                                    <th class="px-6 py-4 text-center">Atrapado</th>
                                    <th class="px-6 py-4 text-center">Nº Nac.</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución</th>
                                    <th class="px-6 py-4">Versión Destacada</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.id] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.id).includes(searchQuery);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesFilter;
            });

            if (filteredPokedex.length === 0) {
                html += `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">No se encontraron Pokémon.</td></tr>`;
            }

            filteredPokedex.forEach((poke) => {
                const isCaught = caughtState[poke.id] || false;
                let badges = '';
                const games = [
                    { name: 'Pokémon X', color: 'bg-sky-100 text-sky-800 border-sky-300' },
                    { name: 'Pokémon Y', color: 'bg-rose-100 text-rose-800 border-rose-300' }
                ];

                games.forEach(g => {
                    if (isAvailableInGame(poke.id, g.name)) {
                        badges += `<button onclick="navigate('${g.name}')" class="px-2 py-1 text-xs border rounded-md font-semibold mr-2 transition hover:opacity-70 ${g.color}">${g.name}</button>`;
                    }
                });

                if (badges === '') badges = `<span class="text-xs text-gray-400 italic">Otras rutas/Evolución</span>`;

                html += `
                    <tr class="hover:bg-gray-50 transition duration-150 ${isCaught ? 'bg-sky-50/50' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-sky-600 rounded border-gray-300 focus:ring-sky-500 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.id})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.id).padStart(3, '0')}</td>
                        <td class="px-6 py-2">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.id}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain pixelated" onerror="this.style.display='none'">
                        </td>
                        <td class="px-6 py-4 font-bold text-base">
                            <a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${poke.name}</a>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium text-sky-700">${poke.evo}</td>
                        <td class="px-6 py-4">${badges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            let headerStyles = '';
            if (gameName === 'Pokémon X') headerStyles = 'bg-sky-600 text-white';
            if (gameName === 'Pokémon Y') headerStyles = 'bg-rose-600 text-white';

            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/20 mb-8">
                        <div class="p-8 ${headerStyles}">
                            <h1 class="text-4xl font-extrabold mb-2">Edición ${gameName}</h1>
                            <p class="text-lg opacity-90">Rutas clave y exclusivos de versión.</p>
                        </div>
                    </div>
                    <div class="space-y-8">
            `;

            if (!routes || routes.length === 0) {
                html += `<p class="text-center text-gray-600 py-10 bg-white/50 rounded-xl">Datos no disponibles.</p>`;
            } else {
                routes.forEach(route => {
                    html += `
                        <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-md overflow-hidden">
                            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                                <h2 class="text-xl font-bold text-gray-800">${route.name}</h2>
                            </div>
                            <div class="p-0 overflow-x-auto">
                                <table class="w-full text-left text-sm whitespace-nowrap">
                                    <thead class="bg-gray-100/50 text-gray-600 text-xs uppercase font-semibold">
                                        <tr>
                                            <th class="px-6 py-3 w-16 text-center">Atrapado</th>
                                            <th class="px-6 py-3">Pokémon</th>
                                            <th class="px-6 py-3">Ratio</th>
                                            <th class="px-6 py-3">Método / Ubicación</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                    `;

                    route.encounters.forEach(encounter => {
                        const pokeName = getPokemonName(encounter.id);
                        const isCaught = caughtState[encounter.id] || false;
                        
                        html += `
                            <tr class="hover:bg-gray-50/80 transition ${isCaught ? 'bg-sky-50/20' : ''}">
                                <td class="px-6 py-3 text-center">
                                    <input type="checkbox" class="w-5 h-5 text-sky-600 rounded border-gray-300 cursor-pointer checkbox-anim focus:ring-sky-500" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                                </td>
                                <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                    <span>
                                        <a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${pokeName}</a> 
                                        <span class="text-xs text-gray-400 font-mono ml-1">#${encounter.id}</span>
                                    </span>
                                </td>
                                <td class="px-6 py-3"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">${encounter.rate}</span></td>
                                <td class="px-6 py-3 text-gray-600">${encounter.method}</td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table></div></div>`;
                });
            }
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const localData = localStorage.getItem('kalosTrackerData');
                if (localData) {
                    caughtState = JSON.parse(localData);
                    renderCurrentView();
                }

                if (typeof __firebase_config === 'undefined') return;
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                await signInAnonymously(auth);

                let mySyncCode = localStorage.getItem('pokemonSyncCode');
                if (!mySyncCode) {
                    mySyncCode = prompt("Ingresa una palabra secreta para sincronizar tu progreso (ej. JulianDex2026):");
                    if (mySyncCode) {
                        localStorage.setItem('pokemonSyncCode', mySyncCode.trim());
                    }
                }

                userId = mySyncCode ? mySyncCode.trim() : auth.currentUser?.uid;
                if (!userId) return;
                
                document.getElementById('storage-status').textContent = "Kalos Tracker - Conectado al Holomisor (Nube activa).";
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        caughtState = { ...caughtState, ...snapshot.data() };
                        renderCurrentView();
                    }
                });
            } catch (error) {
                document.getElementById('storage-status').textContent = "Kalos Tracker - Guardado de manera local en tu Holomisor.";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            navigate('pokedex');
            setupCloudStorage();
        });
    </script>
</body>
</html>
