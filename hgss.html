                { name: "Legendarios", encounters: [{ id: 249, rate: "Historia (Nv 45)", method: "Islas Remolino" }, { id: 250, rate: "Post-Game (Nv 70)", method: "Torre Campana" }, { id: 243, rate: "Errante", method: "Johto" }, { id: 244, rate: "Errante", method: "Johto" }, { id: 245, rate: "Único", method: "Ruta 25 (Kanto)" }, { id: 383, rate: "Exclusivo SS", method: "Torre Oculta (Orbe Rojo)" }, { id: 381, rate: "Errante", method: "Kanto (Evento Máximo)" }, { id: 150, rate: "Único", method: "Cueva Celeste" }, { id: 144, rate: "Único", method: "Islas Espuma" }, { id: 145, rate: "Único", method: "Ruta 10" }, { id: 146, rate: "Único", method: "Monte Plateado" }] }
            ]
        };

        let caughtState = {}; 
        let currentView = 'pokedex';
        let searchQuery = '';
        let filterState = 'all'; 
        
        let db, auth, userId;
        const appId = 'hgss-tracker';

        function getWikidexUrl(name) {
            const safeName = name.replace(/ /g, '_');
            return `https://www.wikidex.net/wiki/${safeName}`;
        }

        function getPokemonName(id) {
            const p = pokedex.find(p => p.id === id);
            return p ? p.name : `Desconocido (${id})`;
        }

        function isAvailableInGame(pokemonId, gameName) {
            if (!routeData[gameName]) return false;
            for (let route of routeData[gameName]) {
                if (route.encounters.some(e => e.id === pokemonId)) return true;
            }
            return false;
        }

        window.toggleCaught = async function(pokemonId) {
            caughtState[pokemonId] = !caughtState[pokemonId];
            renderCurrentView(); 
            localStorage.setItem('hgssTrackerData', JSON.stringify(caughtState));
            
            if (db && userId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                    await setDoc(docRef, caughtState);
                } catch (error) { console.error("Error:", error); }
            }
        }

        window.navigate = function(viewName) {
            currentView = viewName;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-slate-700'));
            document.getElementById(`nav-${viewName}`).classList.add('bg-slate-700');
            renderCurrentView();
            window.scrollTo(0, 0);
        }

        window.updateSearch = function(value) {
            searchQuery = value.toLowerCase();
            renderCurrentView();
        }

        window.updateFilter = function(value) {
            filterState = value;
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('app-content');
            if (currentView === 'pokedex') {
                container.innerHTML = generatePokedexHTML();
                document.body.className = "bg-gray-100 text-gray-800 min-h-screen flex flex-col game-bg-pokedex";
            } else {
                container.innerHTML = generateGamePageHTML(currentView);
                const bgColors = { 'Oro HeartGold': 'game-bg-heartgold', 'Plata SoulSilver': 'game-bg-soulsilver' };
                document.body.className = `text-gray-800 min-h-screen flex flex-col ${bgColors[currentView]}`;
            }
        }

        function generatePokedexHTML() {
            const totalCaught = Object.values(caughtState).filter(v => v).length;
            const progressPercent = Math.round((totalCaught / pokedex.length) * 100);

            let html = `
                <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                    <div class="p-6 bg-slate-800 text-white border-b border-gray-700">
                        <h1 class="text-3xl font-extrabold flex flex-wrap items-center gap-3">
                            Pokédex HG/SS
                            <span class="text-sm font-normal bg-yellow-600 px-3 py-1 rounded-full text-yellow-100">
                                ${totalCaught} / ${pokedex.length} Atrapados
                            </span>
                        </h1>
                        <p class="text-slate-400 mt-2 text-sm">Orden: Pokédex Regional Johto (1-256) y Pokédex Nacional Post-Game.</p>
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-yellow-500 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="mt-6 flex flex-col sm:flex-row gap-4">
                            <input type="text" placeholder="Buscar por nombre o número..." class="px-4 py-2 rounded-lg text-gray-800 w-full sm:w-1/2 focus:ring-2 focus:ring-yellow-500 outline-none" value="${searchQuery}" onkeyup="updateSearch(this.value)">
                            <select class="px-4 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-yellow-500 outline-none cursor-pointer" onchange="updateFilter(this.value)">
                                <option value="all" ${filterState === 'all' ? 'selected' : ''}>Todos los Pokémon</option>
                                <option value="caught" ${filterState === 'caught' ? 'selected' : ''}>Solo Atrapados</option>
                                <option value="missing" ${filterState === 'missing' ? 'selected' : ''}>Faltantes</option>
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600 font-bold">
                                <tr>
                                    <th class="px-6 py-4 text-center">Atrapado</th>
                                    <th class="px-6 py-4 text-center">Nº Nac.</th>
                                    <th class="px-6 py-4">Sprite</th>
                                    <th class="px-6 py-4">Pokémon</th>
                                    <th class="px-6 py-4">Evolución</th>
                                    <th class="px-6 py-4">Versión Destacada</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
            `;

            const filteredPokedex = pokedex.filter(poke => {
                const isCaught = caughtState[poke.id] || false;
                const matchesSearch = poke.name.toLowerCase().includes(searchQuery) || String(poke.id).includes(searchQuery);
                let matchesFilter = true;
                if (filterState === 'caught') matchesFilter = isCaught;
                if (filterState === 'missing') matchesFilter = !isCaught;
                return matchesSearch && matchesFilter;
            });

            if (filteredPokedex.length === 0) {
                html += `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">No se encontraron Pokémon.</td></tr>`;
            }

            let regionalPrinted = false;
            let nationalPrinted = false;

            filteredPokedex.forEach((poke, index) => {
                const isCaught = caughtState[poke.id] || false;
                
                // Los primeros elementos en la variable rawPokedex (antes del id 1 Bulbasaur) son los Regionales
                const originalIndex = pokedex.findIndex(p => p.id === poke.id);
                if (originalIndex < 100 && !regionalPrinted) { 
                    html += `<tr><td colspan="6" class="px-6 py-3 bg-yellow-100 text-yellow-800 font-bold text-center uppercase tracking-widest text-xs border-y border-yellow-300">⬇ Pokédex Regional Johto (1-256) ⬇</td></tr>`;
                    regionalPrinted = true;
                } else if (poke.id === 1 && !nationalPrinted) {
                    html += `<tr><td colspan="6" class="px-6 py-3 bg-slate-800 text-white font-bold text-center uppercase tracking-widest text-xs border-y border-slate-900 mt-4">⬇ Pokédex Nacional (Post-Game) ⬇</td></tr>`;
                    nationalPrinted = true;
                }

                let badges = '';
                const games = [
                    { name: 'Oro HeartGold', color: 'bg-yellow-100 text-yellow-700 border-yellow-300' },
                    { name: 'Plata SoulSilver', color: 'bg-slate-200 text-slate-700 border-slate-400' }
                ];

                games.forEach(g => {
                    if (isAvailableInGame(poke.id, g.name)) {
                        badges += `<button onclick="navigate('${g.name}')" class="px-2 py-1 text-xs border rounded-md font-semibold mr-2 transition hover:opacity-70 ${g.color}">${g.name.split(' ')[1]}</button>`;
                    }
                });

                if (badges === '') badges = `<span class="text-xs text-gray-400 italic">Otras rutas/Evolución</span>`;

                html += `
                    <tr class="hover:bg-gray-50 transition duration-150 ${isCaught ? 'bg-yellow-50/50' : ''}">
                        <td class="px-6 py-4 text-center">
                            <input type="checkbox" class="w-6 h-6 text-yellow-600 rounded border-gray-300 focus:ring-yellow-500 cursor-pointer checkbox-anim" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${poke.id})">
                        </td>
                        <td class="px-6 py-4 text-center font-mono text-gray-500">#${String(poke.id).padStart(3, '0')}</td>
                        <td class="px-6 py-2">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.id}.png" alt="${poke.name}" class="w-12 h-12 inline-block object-contain pixelated" onerror="this.style.display='none'">
                        </td>
                        <td class="px-6 py-4 font-bold text-base">
                            <a href="${getWikidexUrl(poke.name)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${poke.name}</a>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium text-yellow-700">${poke.evo}</td>
                        <td class="px-6 py-4">${badges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        function generateGamePageHTML(gameName) {
            const routes = routeData[gameName];
            let headerStyles = '';
            if (gameName === 'Oro HeartGold') headerStyles = 'bg-yellow-500 text-white';
            if (gameName === 'Plata SoulSilver') headerStyles = 'bg-slate-500 text-white';

            let html = `
                <div class="mb-8">
                    <div class="rounded-xl shadow-lg overflow-hidden border border-white/20 mb-8">
                        <div class="p-8 ${headerStyles}">
                            <h1 class="text-4xl font-extrabold mb-2">Edición ${gameName}</h1>
                            <p class="text-lg opacity-90">Lugares clave, exclusivos y Zona Safari renovada.</p>
                        </div>
                    </div>
                    <div class="space-y-8">
            `;

            if (!routes || routes.length === 0) {
                html += `<p class="text-center text-gray-600 py-10 bg-white/50 rounded-xl">Datos no disponibles.</p>`;
            } else {
                routes.forEach(route => {
                    html += `
                        <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-md overflow-hidden">
                            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                                <h2 class="text-xl font-bold text-gray-800">${route.name}</h2>
                            </div>
                            <div class="p-0 overflow-x-auto">
                                <table class="w-full text-left text-sm whitespace-nowrap">
                                    <thead class="bg-gray-100/50 text-gray-600 text-xs uppercase font-semibold">
                                        <tr>
                                            <th class="px-6 py-3 w-16 text-center">Atrapado</th>
                                            <th class="px-6 py-3">Pokémon</th>
                                            <th class="px-6 py-3">Ratio</th>
                                            <th class="px-6 py-3">Método / Ubicación</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                    `;

                    route.encounters.forEach(encounter => {
                        const pokeName = getPokemonName(encounter.id);
                        const isCaught = caughtState[encounter.id] || false;
                        
                        html += `
                            <tr class="hover:bg-gray-50/80 transition ${isCaught ? 'bg-yellow-50/20' : ''}">
                                <td class="px-6 py-3 text-center">
                                    <input type="checkbox" class="w-5 h-5 text-yellow-600 rounded border-gray-300 cursor-pointer checkbox-anim focus:ring-yellow-500" ${isCaught ? 'checked' : ''} onchange="toggleCaught(${encounter.id})">
                                </td>
                                <td class="px-6 py-3 font-semibold flex items-center gap-3">
                                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${encounter.id}.png" alt="${pokeName}" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
                                    <span>
                                        <a href="${getWikidexUrl(pokeName)}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline transition" title="Ver en Wikidex">${pokeName}</a> 
                                        <span class="text-xs text-gray-400 font-mono ml-1">#${encounter.id}</span>
                                    </span>
                                </td>
                                <td class="px-6 py-3"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">${encounter.rate}</span></td>
                                <td class="px-6 py-3 text-gray-600">${encounter.method}</td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table></div></div>`;
                });
            }
            html += `</div></div>`;
            return html;
        }

        async function setupCloudStorage() {
            try {
                const localData = localStorage.getItem('hgssTrackerData');
                if (localData) {
                    caughtState = JSON.parse(localData);
                    renderCurrentView();
                }

                if (typeof __firebase_config === 'undefined') return;
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);

                    // Sistema de sincronización por código
                    let mySyncCode = localStorage.getItem('pokemonSyncCode');
                    if (!mySyncCode) {
                        mySyncCode = prompt("Ingresa una palabra secreta para sincronizar tu progreso entre dispositivos (ej. JulianDex2026):");
                        if (mySyncCode) {
                            localStorage.setItem('pokemonSyncCode', mySyncCode.trim());
                        }
                    }

                    // Usamos tu palabra secreta como ID principal, o el anónimo si cancelas
                    userId = mySyncCode ? mySyncCode.trim() : auth.currentUser?.uid;
                    if (!userId) return;
                }
                
                document.getElementById('storage-status').textContent = "HG/SS Tracker - Conectado al PC de Bill (Nube activa).";
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'trackerData', 'caughtState');
                
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        caughtState = { ...caughtState, ...snapshot.data() };
                        renderCurrentView();
                    }
                });
            } catch (error) {
                document.getElementById('storage-status').textContent = "HG/SS Tracker - Guardado de manera local en tu Pokédex.";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            navigate('pokedex');
            setupCloudStorage();
        });
    </script>
</body>
</html>
